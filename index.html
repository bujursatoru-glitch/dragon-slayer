<style>
:root{--ink:#120e1c;--panel:#221a34;--panel2:#30264a;--gold:#f2b63d;--crimson:#c8322b;--parch:#f0e3c2;--dim:#a898b8;--sam:#5c9bd6;--sya:#ff8a3c;--disp:"Press Start 2P","Courier New",monospace;--body:"Pixelify Sans","Trebuchet MS",Verdana,sans-serif;color-scheme:dark}

*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#07050c;color:var(--parch);font-family:var(--body);font-size:16px;line-height:1.4;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:none;overscroll-behavior:none}
#game{position:fixed;left:0;top:0;image-rendering:pixelated;image-rendering:crisp-edges;display:block;background:#07050c}
#touch{position:fixed;left:0;right:0;bottom:0;top:0;z-index:5;display:none;touch-action:none;--op:.6;padding-bottom:env(safe-area-inset-bottom,0px)}
#touch.show{display:block}
#touch>[data-k]{position:absolute;transform:translate(-50%,-50%);border-radius:50%;opacity:var(--op)}
.tb{font-family:var(--disp);color:var(--parch);background:rgba(26,18,40,.72);border:3px solid var(--gold);box-shadow:0 0 0 2px #120e1c,inset 0 -5px 0 rgba(0,0,0,.35);padding:0;letter-spacing:0;touch-action:none}
.tb.dn{background:var(--gold);color:#120e1c;transform:translate(-50%,-46%)!important}
.tb[data-b="atk"]{border-color:#ff6a5a}.tb[data-b="ult"]{border-color:#ffe27a;color:#ffe27a}.tb[data-b="spc"]{border-color:#7ad4ff}.tb[data-b="potion"]{border-color:#ff8a9a}
#joy{border:3px solid rgba(240,227,194,.55);background:rgba(26,18,40,.4);box-shadow:0 0 0 2px #120e1c;pointer-events:none}
#touch.edit #joy{pointer-events:auto}

.rot{display:none;position:absolute;left:0;right:0;bottom:calc(8px + env(safe-area-inset-bottom,0px));text-align:center;font-size:13px;color:var(--dim);pointer-events:none}

#pauseBtn.show{display:block}
#ui{position:fixed;inset:0;z-index:10;display:none;overflow:auto;touch-action:pan-y;padding:calc(12px + env(safe-area-inset-top,0px)) 12px calc(12px + env(safe-area-inset-bottom,0px))}
#ui.on{display:flex;align-items:center;justify-content:center;background:rgba(10,6,18,.78)}
#ui.s-title{background:linear-gradient(rgba(10,6,18,.15),rgba(10,6,18,.55))}

.editbar{pointer-events:auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center;background:var(--panel);border:3px solid var(--gold);padding:8px 12px;font-size:14px}
button{font-family:var(--disp);font-size:10px;line-height:1.5;color:var(--parch);background:var(--panel2);border:0;padding:11px 14px;cursor:pointer;box-shadow:0 -3px 0 #4a3c6e,0 3px 0 #120e1c,-3px 0 0 #120e1c,3px 0 0 #120e1c;margin:3px;touch-action:manipulation}

button:active:not(:disabled){transform:translateY(2px)}

.bar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}

.row{display:flex;flex-wrap:wrap;align-items:center;gap:2px;margin:10px 0 0}.row.end{justify-content:flex-end}

.cards{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:10px}

.ci{flex:1;min-width:0}.ci h3{margin:0 0 4px;color:var(--c);font-size:13px}.ci p{font-size:14px;margin:2px 0 6px}.sk{color:var(--dim)}
.stats label{display:flex;align-items:center;justify-content:space-between;font-size:13px;gap:8px}
.stats span{flex:0 0 55%;height:6px;background:#120e1c}.stats i{display:block;height:100%;background:var(--c)}
.stages{list-style:none;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:6px}
.stage{width:calc(100% - 6px);display:grid;grid-template-columns:auto 1fr auto;column-gap:10px;text-align:left;align-items:center;padding:10px}
.stage b{grid-row:span 2;font-size:18px;color:var(--gold)}.stage .nm{font-size:10px}.stage .bs{grid-column:2;font-family:var(--body);font-size:13px;color:var(--dim)}

.acts{display:flex;flex-direction:column;align-items:flex-end;flex:none}.acts button{font-size:8px;padding:8px}

.sl{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:15px;margin:8px 0}
input[type=range]{flex:0 0 55%;accent-color:var(--gold);height:24px;touch-action:pan-x}
.load{text-align:center;width:min(440px,92vw)}.load .line{color:var(--parch);margin:10px auto;max-width:44ch}.load .tip{color:var(--dim);font-size:15px;margin-top:14px;min-height:3em}
#lbar{height:14px;background:#120e1c;box-shadow:0 0 0 3px var(--gold);margin:16px 6px}#lbar i{display:block;height:100%;width:0;background:var(--crimson);box-shadow:inset 0 3px 0 #ff6a5a}
.grade{font-family:var(--disp);font-size:54px;color:#fff;margin:10px 0;text-shadow:0 5px 0 var(--crimson),5px 0 0 #120e1c,-5px 0 0 #120e1c,0 10px 0 #120e1c,0 -5px 0 #120e1c}
.gS{color:var(--gold)}.over h2{color:#ff6a5a}
dl{display:grid;grid-template-columns:1fr auto;gap:2px 16px;text-align:left;font-size:15px;margin:8px 0 12px}dd{text-align:right;color:var(--gold);margin:0}
#toasts{position:fixed;z-index:20;top:calc(44px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;pointer-events:none;align-items:center}

.dev{font-family:var(--disp);font-size:7px;color:var(--dim);letter-spacing:.14em;text-shadow:2px 2px 0 #120e1c;margin-top:-10px!important}
#fsBtn{position:fixed;z-index:6;top:calc(6px + env(safe-area-inset-top,0px));left:calc(50% + 28px);width:36px;height:32px;display:none;padding:0;background:rgba(26,18,40,.7);border:2px solid var(--gold);box-shadow:none;margin:0}
#fsBtn.show{display:block}#fsBtn svg{width:16px;height:16px;display:block;margin:auto}
#netchip{position:fixed;z-index:6;top:calc(8px + env(safe-area-inset-top,0px));right:calc(50% + 30px);display:none;align-items:center;gap:5px;font-family:var(--disp);font-size:7px;color:var(--parch);background:rgba(26,18,40,.72);padding:6px 7px;border:2px solid #3a2e58;pointer-events:none}
#netchip.on{display:flex}#netchip i{width:6px;height:6px;background:#e8455a}#netchip i.ok{background:#7aff9a}
#rotate{position:fixed;inset:0;z-index:30;display:none;align-items:center;justify-content:center;background:rgba(7,5,12,.94);text-align:center;padding:20px}
#rotate.on{display:flex}#rotate .rbox{display:flex;flex-direction:column;align-items:center;gap:14px;max-width:320px}
#rotate .phone{width:44px;height:76px;border:4px solid var(--gold);box-shadow:0 0 0 3px #120e1c;position:relative;animation:rot 2.4s steps(8) infinite}

@keyframes rot{0%,30%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}

#scan{position:fixed;inset:0;z-index:40;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:#07050c;padding:16px}
#scan.on{display:flex}#scan video{width:min(88vw,70vh,420px);aspect-ratio:1;object-fit:cover;border:4px solid var(--gold);box-shadow:0 0 0 4px #120e1c;background:#120e1c}

.mpg{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin:10px 0}

.qrbox{display:flex;justify-content:center;margin:10px 0;min-height:40px}.qrbox canvas{width:min(64vw,52vh,250px);height:auto;image-rendering:pixelated;box-shadow:0 0 0 4px var(--gold),0 0 0 8px #120e1c}
textarea,input[type=text],input:not([type]){width:100%;font-family:var(--body);font-size:14px;color:var(--parch);background:#120e1c;border:2px solid #3a2e58;padding:8px;margin:6px 0;resize:vertical;user-select:text;-webkit-user-select:text;touch-action:auto}

.stages2{list-style:none;padding:0;display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:6px 0}
.stg{width:calc(100% - 6px);display:flex;flex-direction:column;align-items:stretch;text-align:left;padding:6px;gap:4px}
.stg .sc{position:relative;display:block;aspect-ratio:64/36;background:#120e1c;box-shadow:0 0 0 2px #120e1c}
.stg .sc img{width:100%;height:100%;image-rendering:pixelated;display:block}
.stg .sc b{position:absolute;left:5px;top:4px;font-size:12px;color:var(--gold);text-shadow:2px 2px 0 #120e1c}
.stg .sc .gr{position:absolute;right:5px;top:4px;font-style:normal;font-size:12px;color:#7af0ff;text-shadow:2px 2px 0 #120e1c}.stg .sc .gr.gS{color:var(--gold)}
.stg .nm{font-size:9px;line-height:1.4}.stg .bs{font-family:var(--body);font-size:12px;color:var(--dim)}
.stg.lk .sc>img:first-child{filter:grayscale(1) brightness(.4)}.stg .sc img.lki{position:absolute;left:50%;top:50%;width:32px;height:32px;margin:-16px}
.stg:not(:disabled):hover .sc{box-shadow:0 0 0 2px var(--gold)}
@media (max-width:640px){.stages2{grid-template-columns:repeat(2,1fr)}}
@media (max-height:520px) and (min-width:700px){.stages2{grid-template-columns:repeat(6,1fr);gap:6px}.stg .nm{font-size:8px}.stg .bs{font-size:11px}}
/* inventory, achievements */
.items li{gap:10px}.items li .tx{flex:1;min-width:0}
.ach li{display:flex;align-items:center;gap:10px}.ach li.on{background:#211a33}.ach li .ic{width:36px;height:36px}.ach li .ic img{width:28px;height:28px}
/* skill tree */
.tree{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:6px}.br{display:flex;flex-direction:column;align-items:stretch}.br h3{margin:4px 0 8px}
.node{display:flex;align-items:center;gap:10px;text-align:left;padding:6px 8px;width:calc(100% - 6px);font-family:var(--body);font-size:14px}
.node .nt b{display:block;font-family:var(--disp);font-size:9px;line-height:1.5}.node.got{background:#3a2e5c}
.node.max .ic{box-shadow:inset 0 0 0 2px var(--gold),0 0 10px rgba(242,182,61,.5)}.node.sel{outline:3px solid var(--gold);outline-offset:1px}
.node:hover .ic img,.node.sel .ic img{animation:icp .45s steps(3) infinite alternate}@keyframes icp{to{transform:translateY(-2px)}}
.link{display:block;width:4px;height:8px;margin:0 0 0 27px;background:#3a2e58}.link.on{background:var(--gold)}
.skdet{display:flex;align-items:center;gap:12px;margin-top:12px;padding:10px;background:#140f20;box-shadow:inset 0 0 0 2px #3a2e58}
.skdet .tx{flex:1;min-width:0}.skdet b{font-family:var(--disp);font-size:11px;color:var(--gold)}.skdet small{display:block;color:var(--dim);font-size:13px}.skdet p{margin:4px 0 0!important;font-size:15px}
@media (max-width:640px){.tree{grid-template-columns:1fr}}
/* character select */
.card.hero{align-items:flex-start}
.pvw{position:relative;flex:none;width:168px;height:143px;background:radial-gradient(circle at 50% 72%,color-mix(in srgb,var(--c) 32%,#120e1c) 0,#120e1c 72%);box-shadow:inset 0 0 0 2px #3a2e58}
.card .pvw canvas{width:100%;height:100%;background:none}
.pvw .port{position:absolute;left:6px;top:6px;width:45px;height:45px;image-rendering:pixelated;background:#120e1c;box-shadow:0 0 0 2px var(--c)}
.stats label{gap:6px}.stats em{font-style:normal;flex:1}.stats span{flex:0 0 40%}.stats b{font-family:var(--disp);font-size:9px;color:var(--c);width:14px;text-align:right}
@media (max-height:420px),(max-width:640px){.pvw{width:120px;height:102px}.pvw .port{width:33px;height:33px}}
.slot img,.acct img{image-rendering:pixelated}
/* loading card */
.load img.scene{width:min(256px,60vw);aspect-ratio:64/36;image-rendering:pixelated;display:block;margin:0 auto 12px;box-shadow:0 0 0 3px var(--gold),0 0 0 6px #120e1c}
/* touch buttons: icon + label */
.tb{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;line-height:1}
.tb img{width:44%;height:auto;image-rendering:pixelated;pointer-events:none}.tb s{text-decoration:none;font-size:.8em;pointer-events:none}.tb.dn img{filter:brightness(.25)}
/* notifications 2.0 */
#toasts{top:calc(46px + env(safe-area-inset-top,0px));gap:6px}
.note{--nc:var(--gold);position:relative;display:flex;align-items:center;gap:10px;min-width:190px;max-width:min(88vw,340px);padding:6px 12px 6px 6px;background:linear-gradient(90deg,color-mix(in srgb,var(--nc) 24%,#1a1428),#1a1428 70%);box-shadow:0 0 0 2px var(--nc),0 0 0 5px #120e1c,0 7px 0 4px rgba(0,0,0,.3);animation:nin .32s steps(5) both;overflow:hidden}
.note img{width:32px;height:32px;image-rendering:pixelated;flex:none}
.note b{display:block;font-family:var(--disp);font-size:9px;color:var(--nc);line-height:1.6}.note span{display:block;font-size:13px;color:var(--parch)}
.note.out{animation:nout .26s steps(4) forwards}.note.bump img{animation:nb .3s steps(3)}
.note.burst::after{content:'';position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.35) 45%,transparent 60%);transform:translateX(-100%);animation:shine .9s steps(9) .2s;pointer-events:none}
.note.burst img{animation:icp .35s steps(3) 6 alternate}
.note.k-gold{min-width:0;padding:3px 10px 3px 4px}.note.k-gold img{width:22px;height:22px}
.note.k-lowhp{animation:nin .32s steps(5) both,hb .5s steps(2) .3s 3}
@keyframes nin{0%{transform:translateY(-18px) scale(.92);opacity:0}70%{transform:translateY(2px) scale(1.02);opacity:1}100%{transform:none}}
@keyframes nout{to{transform:translateY(-12px);opacity:0}}@keyframes nb{50%{transform:scale(1.3)}}@keyframes shine{to{transform:translateX(100%)}}
@keyframes hb{50%{box-shadow:0 0 0 2px #fff,0 0 0 5px #120e1c}}
@media (prefers-reduced-motion:reduce){.panel,.load,.title .menu,.credits .roll,.note,.note img,.node .ic img{animation:none!important}}
</style>

  line(x0,y0,x1,y1,c,t=1){const dx=x1-x0,dy=y1-y0,n=Math.max(1,Math.ceil(Math.max(Math.abs(dx),Math.abs(dy))));for(let i=0;i<=n;i++)this.stamp(x0+dx*i/n,y0+dy*i/n,t,c)}

  ell(cx,cy,rx,ry,c){for(let j=-Math.ceil(ry);j<=ry;j++)for(let i=-Math.ceil(rx);i<=rx;i++)if(i*i/(rx*rx+.01)+j*j/(ry*ry+.01)<=1.05)this.set(cx+i,cy+j,c)}
  poly(pts,c){let ymin=1e9,ymax=-1e9;for(const p of pts){ymin=Math.min(ymin,p[1]);ymax=Math.max(ymax,p[1])}
    for(let y=Math.round(ymin);y<=Math.round(ymax);y++){const xs=[];for(let i=0;i<pts.length;i++){const a=pts[i],b=pts[(i+1)%pts.length];if((a[1]<=y&&b[1]>y)||(b[1]<=y&&a[1]>y))xs.push(a[0]+(y-a[1])/(b[1]-a[1])*(b[0]-a[0]))}

  bmp(rows,pal,dx,dy,flip){for(let j=0;j<rows.length;j++){const r=rows[j];for(let i=0;i<r.length;i++){const c=pal[r[i]];if(c)this.set(dx+(flip?r.length-1-i:i),dy+j,c)}}}

function drawWeapon(L,W,hx,hy,a,glow){if(!W)return;const[s,c]=ang(a),px=c,py=-s,k=W.kind,n=W.len;

  else if(k==='bow'){for(let i=-4;i<=4;i++){const u=i/4,off=(1-u*u)*3;L.set(hx+px*u*(n/2)+s*off,hy+py*u*(n/2)+c*off,W.blade)}L.line(hx+px*(n/2),hy+py*(n/2),hx-px*(n/2),hy-py*(n/2),W.edge,1)}

/* draws one frame of rig R in pose P with feet origin (ox,oy) */
function drawHuman(pb,R,P,ox,oy,ground){

/* ---- sheet baker: anims = {name:{k:[[pose,frames,'h'?]...],loop,air} | {fn,n,loop,air}} ---- */
function bakeFrames(R,anims,fw,fh,ox,oy,draw){
  const list=[],meta={};draw=draw||drawHuman;
  for(const name in anims){const A=anims[name],fr=[];
    if(A.fn){for(let i=0;i<A.n;i++)fr.push([fullPose(A.fn(i/A.n),R.base),A.d||1])}
    else{const K=A.k.map(k=>[fullPose(k[0],R.base),k[1],k[2]]);
      for(let i=0;i<K.length;i++){const[p,n,m]=K[i],nx=K[i+1]||(A.loop?K[0]:null);
        if(m==='h'||!nx)fr.push([p,n]);else for(let j=0;j<n;j++){const u=j/n;fr.push([j?mixPose(p,nx[0],m==='l'?u:u*u*(3-2*u)):p,1])}}}
    const ft=[];let t=0;for(const f of fr){ft.push(t);t+=f[1]*TPF}
    meta[name]={s:list.length,n:fr.length,ft,len:t,loop:!!A.loop};
    for(const f of fr)list.push({p:f[0],g:!A.air})}
  const cols=Math.min(16,list.length),rows=Math.ceil(list.length/cols);
  const cv=mkCanvas(cols*fw,rows*fh),cx=ctx2d(cv),pb=new PB(fw,fh);
  return{cv,cx,pb,list,meta,cols,fw,fh,ox,oy,R,draw,i:0};
}
function bakeStep(B,count){for(let k=0;k<count&&B.i<B.list.length;k++,B.i++){const f=B.list[B.i];B.pb.clear();B.draw(B.pb,B.R,f.p,B.ox,B.oy,f.g);B.pb.put(B.cx,(B.i%B.cols)*B.fw,(B.i/B.cols|0)*B.fh)}return B.i>=B.list.length}
function bakeAll(R,anims,fw,fh,ox,oy,draw){const B=bakeFrames(R,anims,fw,fh,ox,oy,draw);bakeStep(B,1e9);return sheetOf(B)}
function sheetOf(B){return{cv:B.cv,meta:B.meta,cols:B.cols,fw:B.fw,fh:B.fh,ox:B.ox,oy:B.oy}}
/* frame index for anim `a` at tick `t` */
function animFrame(S,a,t){const m=S.meta[a];if(!m)return 0;if(m.loop)t%=m.len;else if(t>=m.len)return m.s+m.n-1;let i=m.n-1;while(i>0&&m.ft[i]>t)i--;return m.s+i}

function drawSprite(ctx,S,a,t,x,y,face,flash,alpha){const f=animFrame(S,a,t),sx=(f%S.cols)*S.fw,sy=(f/S.cols|0)*S.fh;x=Math.round(x);y=Math.round(y);
  let src=S.cv,ssx=sx,ssy=sy;
  if(flash){let F=FLASH[S.fw+'x'+S.fh];if(!F){F=FLASH[S.fw+'x'+S.fh]=mkCanvas(S.fw,S.fh);F.x=ctx2d(F)}const fx=F.x;fx.globalCompositeOperation='copy';fx.drawImage(S.cv,sx,sy,S.fw,S.fh,0,0,S.fw,S.fh);fx.globalCompositeOperation='source-atop';fx.fillStyle=flash;fx.fillRect(0,0,S.fw,S.fh);src=F;ssx=0;ssy=0}
  if(alpha!==undefined)ctx.globalAlpha=alpha;
  if(face<0){ctx.save();ctx.translate(x,y);ctx.scale(-1,1);ctx.drawImage(src,ssx,ssy,S.fw,S.fh,-S.ox,-S.oy,S.fw,S.fh);ctx.restore()}
  else ctx.drawImage(src,ssx,ssy,S.fw,S.fh,x-S.ox,y-S.oy,S.fw,S.fh);
  if(alpha!==undefined)ctx.globalAlpha=1}

function tileAt(tx,ty){const L=G.lvl;if(tx<0||tx>=L.w)return 1;if(ty<0||ty>=L.h)return 0;return L.t[ty*L.w+tx]}
function moveEnt(e){const hw=e.w/2;e.hitWall=0;
  if(e.vx){let nx=e.x+e.vx;const ex=e.vx>0?nx+hw:nx-hw,tx=Math.floor(ex/16),y0=Math.floor((e.y-e.h+1)/16),y1=Math.floor((e.y-1)/16);
    for(let ty=y0;ty<=y1;ty++)if(SOLID(tileAt(tx,ty))){nx=e.vx>0?tx*16-hw-.01:(tx+1)*16+hw+.01;e.vx=0;e.hitWall=1;break}e.x=nx}
  const py=e.y;let ny=e.y+e.vy;e.onGround=false;const x0=Math.floor((e.x-hw+.5)/16),x1=Math.floor((e.x+hw-.5)/16);
  if(e.vy>=0){const ty=Math.floor(ny/16);for(let tx=x0;tx<=x1;tx++){const t=tileAt(tx,ty);if(SOLID(t)||((t===2||t===7)&&py<=ty*16+.01&&!(e.dropT>0))){ny=ty*16;e.vy=0;e.onGround=true;e.gt=t;if(SOLID(t))break}}}
  else{const ty=Math.floor((ny-e.h)/16);for(let tx=x0;tx<=x1;tx++)if(SOLID(tileAt(tx,ty))){ny=(ty+1)*16+e.h+.01;e.vy=0;break}}
  e.y=ny}
function clampArena(e){const L=G.lock,a=L?L.x0+7:7,b=L?L.x1-7:G.lvl.w*16-7;if(e.x<a){e.x=a;if(e.vx<0)e.vx=0;e.hitWall=1}if(e.x>b){e.x=b;if(e.vx>0)e.vx=0;e.hitWall=1}}
function groundBelow(x,y){const tx=Math.floor(x/16);for(let ty=Math.floor(y/16);ty<G.lvl.h;ty++){const t=tileAt(tx,ty);if(SOLID(t)||t===2||t===7)return ty*16}return null}
const ovl=(a,b)=>a[0]<b[0]+b[2]&&a[0]+a[2]>b[0]&&a[1]<b[1]+b[3]&&a[1]+a[3]>b[1];
const circRect=(x,y,r,b)=>{const cx=clamp(x,b[0],b[0]+b[2]),cy=clamp(y,b[1],b[1]+b[3]);return(x-cx)*(x-cx)+(y-cy)*(y-cy)<=r*r};

function pt(x,y,vx,vy,l,c,s,g,add){const P=G.parts;if(P.length>=G.pcap)return;const o=PPOOL.pop()||{};o.x=x;o.y=y;o.vx=vx;o.vy=vy;o.l=l;o.m=l;o.c=c;o.s=s||1;o.g=g||0;o.add=add;P.push(o)}
function sparks(x,y,n,pal,sp){n=Math.ceil(n*G.pq);for(let i=0;i<n;i++){const a=rnd(TAU),v=rnd(.5,sp||2.6);pt(x,y,Math.cos(a)*v,Math.sin(a)*v-.6,rndi(8,18),PC[pal]||PC.spark,chance(.3)?2:1,.12,1)}}
function dust(x,y,n){n=Math.ceil((n||3)*G.pq);for(let i=0;i<n;i++)pt(x+rnd(-4,4),y-1,rnd(-.8,.8),rnd(-.7,-.1),rndi(12,24),PC.dust,chance(.5)?2:1,-.01)}
function fireP(x,y,n,pal,sp){n=Math.ceil(n*G.pq);for(let i=0;i<n;i++)pt(x+rnd(-3,3),y,rnd(-.4,.4)*(sp||1),rnd(-1.6,-.5)*(sp||1),rndi(12,26),PC[pal||'fire'],chance(.4)?2:1,-.02,1)}

function shoot(kind,x,y,p,sp,dmg,o){const dx=p.x-x,dy=(p.y-p.h*.5)-y,d=Math.hypot(dx,dy)||1;const s=Object.assign({kind,x,y,vx:dx/d*sp,vy:dy/d*sp,dmg,from:'e',life:220,r:4,g:0,t:0},o);G.shots.push(s);return s}

function spawnEnemy(type,x,y,o){const c=ENEMY[type];let e;if(type==='dravok')e=new Dragon(x,y,o);else if(c.boss)e=new Boss(type,x,y,o);else e=new Enemy(type,x,y,o);if(G.lock)e.inArena=true;G.enemies.push(e);return e}
function dropLoot(x,y,gold,extra){let n=Math.min(12,Math.max(1,Math.round(gold/3))),v=Math.max(1,Math.round(gold/n));for(let i=0;i<n;i++)G.picks.push({k:'coin',x,y:y-6,vx:rnd(-1.6,1.6),vy:rnd(-3.6,-1.6),t:0,v});if(extra)G.picks.push({k:extra,x,y:y-6,vx:rnd(-.8,.8),vy:-3,t:0})}
function gainExp(n){SAVE.exp+=n;G.stats.exp+=n;while(SAVE.exp>=expNeed(SAVE.lvl)){SAVE.exp-=expNeed(SAVE.lvl);SAVE.lvl++;SAVE.sp++;for(const p of G.players){p.refresh();if(p.alive){p.hp=p.s.maxHp;p.mp=p.s.maxMp;label('LEVEL UP!',p.x,p.y-40,'#ffe27a',2);ring(p.x,p.y-12,'white')}}AU.sfx('levelup');UI.note('level',{t:t('n.level'),s:t('n.level.s',{n:SAVE.lvl})});if(SAVE.lvl>=5)unlockAch('lvl5');if(SAVE.lvl>=10)unlockAch('lvl10')}}

function openChest(c,p){if(c.open)return;c.open=true;AU.sfx('chest');sparks(c.x,c.y-8,14,'gold');ring(c.x,c.y-8,'white');const l=c.loot||{};if(l.gold)dropLoot(c.x,c.y-6,l.gold);if(l.potion){SAVE.potions+=l.potion;label('+'+l.potion+' POTION',c.x,c.y-22,'#ff8a9a')}if(l.item)giveItem(l.item);
  SAVE.stats.chests++;if(SAVE.stats.chests>=10)unlockAch('chest10');if(c.secret!==undefined){SAVE.stats.secrets[c.secret]=1;const n=Object.keys(SAVE.stats.secrets).length;UI.toast('Hidden room','Secrets found: '+n+' of 6');if(n>=3)unlockAch('secret3');if(n>=6)unlockAch('secret6')}}
function breakProp(p){if(p.dead)return;p.dead=true;AU.sfx('break');sparks(p.x,p.y-6,10,p.k==='pot'?'stone':'wood',2);dropLoot(p.x,p.y,rndi(2,6),chance(.18)?'heart':null)}
function breakTile(tx,ty){G.lvl.t[ty*G.lvl.w+tx]=0;AU.sfx('break');sparks(tx*16+8,ty*16+8,14,'stone',2.4);G.shake=Math.max(G.shake,3)}
function updShots(){const S=G.shots;for(let i=S.length-1;i>=0;i--){const s=S[i];s.x+=s.vx;s.y+=s.vy;s.vy+=s.g||0;s.life--;s.t++;let dead=s.life<=0;
    if(s.kind==='fireball'||s.kind==='firewall'){if(s.t%2===0)fireP(s.x,s.y-(s.kind==='firewall'?rnd(0,s.h):0),1)}else if(s.kind==='shock'){if(s.t%2===0)pt(s.x,s.y+6,rnd(-.3,.3),rnd(-1.8,-.6),12,PC.dust,2)}else if(s.kind==='wave'&&s.t%2===0)pt(s.x,s.y+rnd(-10,10),-s.vx*.2,0,10,PC[ARCPAL[s.set]||'blue'],1,0,1);
    if(!s.ghost){const tl=tileAt(Math.floor(s.x/16),Math.floor(s.y/16));if(SOLID(tl))dead=true}
    if(s.ground){const t2=tileAt(Math.floor(s.x/16),Math.floor((s.y+10)/16));if(!SOLID(t2)&&t2!==2)dead=true}
    if(s.from==='e'){const b0=s.h?[s.x-s.r,s.y-s.h,s.r*2,s.h]:null;for(const p of G.players){if(!p.alive||(s.hs&&s.hs.has(p)))continue;const b=p.box();if(b0?ovl(b0,b):circRect(s.x,s.y,s.r,b)){const r=p.hurt(s.dmg,Math.sign(s.vx||1)*(s.knock?3.5:2),s.knock?-3:-1.5,{x:s.x-s.vx*4},{proj:1,slow:s.slow,knock:s.knock,elem:s.kind==='fireball'||s.kind==='firewall'?'fire':0});if(r){if(s.pierce)(s.hs=s.hs||new Set()).add(p);else dead=true}}}}
    else if(s.from==='p'){for(const e of G.enemies){if(e.st==='dead'||e.gone||s.hs.has(e))continue;const bs=e.boxes?e.boxes():[{b:e.box(),m:1}];for(const B of bs)if(circRect(s.x,s.y,s.r,B.b)){s.hs.add(e);s.src.dealHit(e,s.a,B,[s.x,s.y],Math.sign(s.vx));if(!s.pierce)dead=true;break}}
      for(const p of G.props)if(!p.dead&&circRect(s.x,s.y,s.r,[p.x-6,p.y-12,12,12]))breakProp(p)}
    if(dead){if(s.kind==='fireball'){ring(s.x,s.y,'fire');AU.sfx('fire');if(s.zone)zone(s.x,groundBelow(s.x,s.y-8)||s.y,s.zone.w,s.zone.h,s.dmg*.6,'fire',0,s.zone.life)}else if(s.kind==='icicle'||s.kind==='shard'){sparks(s.x,s.y,6,'ice');AU.sfx('ice')}else if(s.kind==='rock')dust(s.x,s.y,5);else if(s.kind==='web'||s.kind==='venom')sparks(s.x,s.y,4,'green',1.2);S.splice(i,1)}}}
function updZones(){const Z=G.zones;for(let i=Z.length-1;i>=0;i--){const z=Z[i];if(z.tele>0){z.tele--;if(z.tele===0){AU.sfx(z.kind==='ice'?'ice':z.kind==='venom'?'hiss':z.kind==='dark'?'bolt':'fire');if(z.kind==='pillar'||z.kind==='dark')G.shake=Math.max(G.shake,3)}continue}
    z.life--;z.t++;const pal=z.kind==='ice'?'ice':z.kind==='venom'?'green':z.kind==='dark'?'dark':'fire';
    if(z.kind==='ice'){if(z.t===1)sparks(z.x,z.y-8,8,'ice')}else if(G.time%2===0)fireP(z.x+rnd(-z.w/2,z.w/2),z.y-rnd(0,z.h*.7),z.kind==='pillar'||z.kind==='dark'?3:1,pal,z.kind==='pillar'?1.6:1);
    const b=[z.x-z.w/2,z.y-z.h,z.w,z.h];for(const p of G.players)if(p.alive&&ovl(b,p.box()))p.hurt(z.dmg,(p.x>z.x?1:-1)*2,-3,{x:z.x},{unblock:1,elem:pal==='fire'?'fire':0,slow:z.kind==='ice'||z.kind==='venom'});

function updPicks(){const P=G.picks;for(let i=P.length-1;i>=0;i--){const k=P[i];k.t++;k.vy+=.22;k.w=6;k.h=6;let near=null,nd=1e9;for(const p of G.players)if(p.alive){const d=Math.hypot(p.x-k.x,p.y-10-k.y);if(d<nd){nd=d;near=p}}

    if(near&&k.t>10&&nd<12){if(k.k==='coin'){addGold(k.v);G.stats.gold+=k.v;AU.sfx('coin');UI.goldNote(k.v)}else if(k.k==='heart'){near.hp=Math.min(near.s.maxHp,near.hp+Math.round(near.s.maxHp*.18));AU.sfx('potion');sparks(near.x,near.y-12,8,'heal',1.5)}else if(k.k==='potion'){SAVE.potions++;AU.sfx('potion');label('+1 POTION',k.x,k.y-10,'#ff8a9a')}P.splice(i,1)}else if(k.t>900||k.y>G.lvl.h*16+40)P.splice(i,1)}}

/* ===== tiny QR encoder (byte mode, ECC level M, versions 1-25) used for offline WebRTC signaling ===== */
const QR=(()=>{
  const ECC=[-1,10,16,26,18,24,16,18,22,22,26,30,22,22,24,24,28,28,26,26,26,26,28,28,28,28];
  const NB=[-1,1,1,1,2,2,4,4,4,5,5,5,8,9,9,10,10,11,13,14,16,17,17,18,20,21];
  const gmul=(x,y)=>{let z=0;for(let i=7;i>=0;i--){z=(z<<1)^((z>>>7)*0x11D);z^=((y>>>i)&1)*x}return z&255};
  const rawMods=v=>{let r=(16*v+128)*v+64;if(v>=2){const n=Math.floor(v/7)+2;r-=(25*n-10)*n-55;if(v>=7)r-=36}return r};
  const dataCW=v=>Math.floor(rawMods(v)/8)-ECC[v]*NB[v];
  function rsDiv(d){const r=new Array(d).fill(0);r[d-1]=1;let root=1;for(let i=0;i<d;i++){for(let j=0;j<d;j++){r[j]=gmul(r[j],root);if(j+1<d)r[j]^=r[j+1]}root=gmul(root,2)}return r}
  function rsRem(data,div){const r=new Array(div.length).fill(0);for(const b of data){const f=b^r.shift();r.push(0);div.forEach((c,i)=>r[i]^=gmul(c,f))}return r}
  function alignPos(v){if(v===1)return[];const n=Math.floor(v/7)+2,size=v*4+17,step=v===32?26:Math.ceil((v*4+4)/(n*2-2))*2,r=[6];for(let p=size-7;r.length<n;p-=step)r.splice(1,0,p);return r}
  function encode(text){
    const bytes=Array.from(new TextEncoder().encode(text));let ver=0;
    for(let v=1;v<=25;v++){const cap=dataCW(v)*8,need=4+(v<=9?8:16)+bytes.length*8;if(need<=cap){ver=v;break}}
    if(!ver)throw new Error('Text too long for QR');
    const bits=[],push=(val,n)=>{for(let i=n-1;i>=0;i--)bits.push((val>>>i)&1)};
    push(4,4);push(bytes.length,ver<=9?8:16);for(const b of bytes)push(b,8);
    const cap=dataCW(ver)*8;push(0,Math.min(4,cap-bits.length));while(bits.length%8)bits.push(0);
    const data=[];for(let i=0;i<bits.length;i+=8){let b=0;for(let j=0;j<8;j++)b=(b<<1)|bits[i+j];data.push(b)}
    for(let p=0xEC;data.length<dataCW(ver);p^=0xEC^0x11)data.push(p);
    const nb=NB[ver],el=ECC[ver],raw=Math.floor(rawMods(ver)/8),nShort=nb-raw%nb,shortLen=Math.floor(raw/nb),div=rsDiv(el),blocks=[];
    for(let i=0,k=0;i<nb;i++){const dat=data.slice(k,k+shortLen-el+(i<nShort?0:1));k+=dat.length;const ec=rsRem(dat,div);if(i<nShort)dat.push(0);blocks.push(dat.concat(ec))}
    const all=[];for(let i=0;i<blocks[0].length;i++)blocks.forEach((b,j)=>{if(i!==shortLen-el||j>=nShort)all.push(b[i])});
    const size=ver*4+17,M=[],F=[];for(let y=0;y<size;y++){M.push(new Array(size).fill(false));F.push(new Array(size).fill(false))}
    const fn=(x,y,d)=>{M[y][x]=d;F[y][x]=true};
    for(let i=0;i<size;i++){fn(6,i,i%2===0);fn(i,6,i%2===0)}
    const finder=(cx,cy)=>{for(let dy=-4;dy<=4;dy++)for(let dx=-4;dx<=4;dx++){const d=Math.max(Math.abs(dx),Math.abs(dy)),x=cx+dx,y=cy+dy;if(x>=0&&x<size&&y>=0&&y<size)fn(x,y,d!==2&&d!==4)}};
    finder(3,3);finder(size-4,3);finder(3,size-4);
    const al=alignPos(ver),na=al.length;for(let i=0;i<na;i++)for(let j=0;j<na;j++){if((i===0&&j===0)||(i===0&&j===na-1)||(i===na-1&&j===0))continue;for(let dy=-2;dy<=2;dy++)for(let dx=-2;dx<=2;dx++)fn(al[i]+dx,al[j]+dy,Math.max(Math.abs(dx),Math.abs(dy))!==1)}
    const drawFormat=mask=>{const d=(0<<3)|mask;let r=d;for(let i=0;i<10;i++)r=(r<<1)^((r>>>9)*0x537);const b=((d<<10)|r)^0x5412,g=i=>((b>>>i)&1)!==0;
      for(let i=0;i<=5;i++)fn(8,i,g(i));fn(8,7,g(6));fn(8,8,g(7));fn(7,8,g(8));for(let i=9;i<15;i++)fn(14-i,8,g(i));
      for(let i=0;i<8;i++)fn(size-1-i,8,g(i));for(let i=8;i<15;i++)fn(8,size-15+i,g(i));fn(8,size-8,true)};
    drawFormat(0);
    if(ver>=7){let r=ver;for(let i=0;i<12;i++)r=(r<<1)^((r>>>11)*0x1F25);const b=(ver<<12)|r;for(let i=0;i<18;i++){const bit=((b>>>i)&1)!==0,a=size-11+i%3,c=Math.floor(i/3);fn(a,c,bit);fn(c,a,bit)}}
    let i=0;for(let right=size-1;right>=1;right-=2){if(right===6)right=5;for(let v=0;v<size;v++)for(let j=0;j<2;j++){const x=right-j,up=((right+1)&2)===0,y=up?size-1-v:v;if(!F[y][x]&&i<all.length*8){M[y][x]=((all[i>>>3]>>>(7-(i&7)))&1)!==0;i++}}}
    const maskF=[(x,y)=>(x+y)%2===0,(x,y)=>y%2===0,(x,y)=>x%3===0,(x,y)=>(x+y)%3===0,(x,y)=>(Math.floor(x/3)+Math.floor(y/2))%2===0,(x,y)=>x*y%2+x*y%3===0,(x,y)=>(x*y%2+x*y%3)%2===0,(x,y)=>((x+y)%2+x*y%3)%2===0];
    const apply=m=>{for(let y=0;y<size;y++)for(let x=0;x<size;x++)if(!F[y][x]&&maskF[m](x,y))M[y][x]=!M[y][x]};
    const penalty=()=>{let p=0;for(let y=0;y<size;y++){let run=1;for(let x=1;x<=size;x++){if(x<size&&M[y][x]===M[y][x-1])run++;else{if(run>=5)p+=run-2;run=1}}}
      for(let x=0;x<size;x++){let run=1;for(let y=1;y<=size;y++){if(y<size&&M[y][x]===M[y-1][x])run++;else{if(run>=5)p+=run-2;run=1}}}
      for(let y=0;y<size-1;y++)for(let x=0;x<size-1;x++){const c=M[y][x];if(c===M[y][x+1]&&c===M[y+1][x]&&c===M[y+1][x+1])p+=3}
      let dark=0;for(const r of M)for(const c of r)if(c)dark++;p+=Math.floor(Math.abs(dark*20-size*size*10)/(size*size))*10;return p};
    let best=0,bp=1e9;for(let m=0;m<8;m++){apply(m);drawFormat(m);const p=penalty();if(p<bp){bp=p;best=m}apply(m)}
    apply(best);drawFormat(best);return{size,M,ver}}
  function canvas(text,px){const q=encode(text),s=px||Math.max(3,Math.floor(300/(q.size+8))),c=document.createElement('canvas');c.width=c.height=(q.size+8)*s;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.fillStyle='#000';
    for(let y=0;y<q.size;y++)for(let X=0;X<q.size;X++)if(q.M[y][X])x.fillRect((X+4)*s,(y+4)*s,s,s);return c}
  return{encode,canvas};
})();

/* ===== NETWORK CO-OP: host-authoritative, two transports =====
   LOCAL HOTSPOT : WebRTC DataChannel, offer/answer exchanged as QR codes (no internet, no server)
   ONLINE / LAN  : WebSocket relay server (server/server.js) with room codes and reconnect tokens
   The host simulates everything (both heroes, enemies, damage, loot). The guest sends its pad
   every tick and renders interpolated snapshots + replayed effect events. */
const NET_PROTO=3;
const ONLINE_SERVER_URL='';  /* e.g. 'wss://samsya-server.onrender.com/ws'  (leave '' to use the server that served this page) */
const r2=v=>Math.round(v*100)/100;

/* ---- compact SDP: keeps only what a DataChannel needs, so it fits in a scannable QR ---- */
function sdpPack(sdp,kind){const g=k=>{const m=sdp.match(new RegExp('a='+k+':([^\\r\\n]*)'));return m?m[1].trim():''};
  const fp=(g('fingerprint').split(' ')[1]||'');const bin=fp.split(':').map(h=>String.fromCharCode(parseInt(h,16))).join('');
  const su={actpass:'x',active:'a',passive:'p'}[g('setup')]||'x';const C=[];
  for(const m of sdp.matchAll(/a=candidate:\S+ 1 udp \d+ (\S+) (\d+) typ (host|srflx)/gi)){const c=m[1]+','+(+m[2]).toString(36)+(m[3]==='srflx'?',s':'');if(!C.includes(c))C.push(c)}
  return['SS1',kind,su,g('ice-ufrag'),g('ice-pwd'),btoa(bin).replace(/=+$/,''),C.join(';')].join('|')}
function sdpUnpack(s,want){s=String(s||'').trim().replace(/\s+/g,'');const p=s.split('|');if(p[0]!=='SS1'||p.length<7)throw new Error('That is not a SAM & SYA connection code');
  const[,kind,su,uf,pw,fb,cs]=p;if(want&&kind!==want)throw new Error(want==='O'?'This is an answer code. Scan the HOST invite instead.':'This is an invite code. Scan the code shown on your partner\u2019s phone after they joined.');
  const bin=atob(fb+'='.repeat((4-fb.length%4)%4)),fp=[...bin].map(c=>c.charCodeAt(0).toString(16).padStart(2,'0').toUpperCase()).join(':');
  const L=['v=0','o=- 4611731400430051336 2 IN IP4 127.0.0.1','s=-','t=0 0','a=group:BUNDLE 0','a=msid-semantic: WMS','m=application 9 UDP/DTLS/SCTP webrtc-datachannel','c=IN IP4 0.0.0.0',
    'a=ice-ufrag:'+uf,'a=ice-pwd:'+pw,'a=ice-options:trickle','a=fingerprint:sha-256 '+fp,'a=setup:'+({x:'actpass',a:'active',p:'passive'}[su]||'actpass'),'a=mid:0','a=sctp-port:5000','a=max-message-size:262144'];
  (cs?cs.split(';'):[]).forEach((c,i)=>{const[ip,pt,t]=c.split(',');L.push(`a=candidate:${i+1} 1 udp ${2122260223-i*256} ${ip} ${parseInt(pt,36)} typ ${t==='s'?'srflx':'host'} generation 0`)});
  L.push('a=end-of-candidates');return L.join('\r\n')+'\r\n'}

/* ---- transport: WebRTC (local) ---- */
class RTCT{
  constructor(h){this.h=h;this.kind='rtc';this.pc=new RTCPeerConnection({iceServers:[]});this.pc.onconnectionstatechange=()=>{const s=this.pc.connectionState;if(s==='failed'||s==='closed')this.lost('rtc '+s)}}
  bind(dc){this.dc=dc;dc.onopen=()=>this.h.peer(true);dc.onclose=()=>this.lost('channel closed');dc.onmessage=e=>this.h.msg(e.data)}
  lost(r){if(this.dead)return;this.dead=true;this.h.peer(false,r)}
  gather(){return new Promise(res=>{const pc=this.pc;if(pc.iceGatheringState==='complete')return res();const t=setTimeout(res,3500);pc.addEventListener('icegatheringstatechange',()=>{if(pc.iceGatheringState==='complete'){clearTimeout(t);res()}})})}
  async offer(){this.bind(this.pc.createDataChannel('g',{ordered:true}));await this.pc.setLocalDescription(await this.pc.createOffer());await this.gather();return sdpPack(this.pc.localDescription.sdp,'O')}
  async answer(code){const sdp=sdpUnpack(code,'O');this.pc.ondatachannel=e=>this.bind(e.channel);await this.pc.setRemoteDescription({type:'offer',sdp});await this.pc.setLocalDescription(await this.pc.createAnswer());await this.gather();return sdpPack(this.pc.localDescription.sdp,'A')}
  async accept(code){await this.pc.setRemoteDescription({type:'answer',sdp:sdpUnpack(code,'A')})}
  send(s){if(this.dc&&this.dc.readyState==='open'){if(this.dc.bufferedAmount>1e6)return;this.dc.send(s)}}
  close(){this.dead=true;try{this.dc&&this.dc.close()}catch(e){}try{this.pc.close()}catch(e){}}
}
/* ---- transport: WebSocket relay (online, or LAN server running in Termux) ---- */
class WST{
  constructor(h,url){this.h=h;this.kind='ws';this.url=url;this.code=null;this.token=null;this.want=null;this.tries=0;this.closed=false}
  open(first){this.want=first;this.connect()}
  connect(){let ws;try{ws=this.ws=new WebSocket(this.url)}catch(e){this.h.err('Bad server address');return}
    ws.onopen=()=>{this.tries=0;ws.send(JSON.stringify(this.token?{t:'rejoin',code:this.code,token:this.token,v:NET_PROTO}:this.want))};
    ws.onmessage=e=>{const d=e.data;if(d[0]==='>'){this.h.msg(d.slice(1));return}let m;try{m=JSON.parse(d)}catch(x){return}
      if(m.t==='created'||m.t==='joined'||m.t==='rejoined'){this.code=m.code;this.token=m.token;this.slot=m.slot;this.h.room(m)}
      else if(m.t==='peer')this.h.peer(!!m.on,m.on?'':'partner offline');
      else if(m.t==='err'){this.h.err(m.m);if(m.fatal){this.closed=true;ws.close()}}};
    ws.onclose=()=>{if(this.closed)return;this.h.link(false);if(this.token&&this.tries<30){this.tries++;setTimeout(()=>{if(!this.closed)this.connect()},2000)}else if(!this.token)this.h.err('Cannot reach the multiplayer server')};

  over(){const g=NET.on&&NET.role==='guest';return`<div class="panel narrow over"><h2>${t('over.title')}</h2><p>${esc(t('over.line',{s:NM.stage(G.lvl.i)}))}</p><nav class="menu"><button class="pri" data-a="retry">${g?t('askretry'):t('retry')}</button>${g?`<button class="danger" data-a="netleave">${t('leaveroom')}</button>`:`<button data-a="quit">${t('leave')}</button>`}</nav></div>`},
  win(r){const m=Math.floor(r.sec/60),s=String(r.sec%60).padStart(2,'0'),g=NET.on&&NET.role==='guest';return`<div class="panel narrow win"><h2>${t('win.title')}</h2><div class="grade g${r.grade}">${r.grade}</div><dl><dt>${t('win.time')}</dt><dd>${m}:${s}</dd><dt>${t('win.combo')}</dt><dd>${t('win.hits',{n:r.s.combo})}</dd><dt>${t('win.dmg')}</dt><dd>${r.s.dmg}</dd><dt>${t('win.kills')}</dt><dd>${r.s.kills}</dd><dt>${t('win.gold')}</dt><dd>${r.s.gold}</dd><dt>${t('win.bonus')}</dt><dd>+${r.bonus}</dd></dl>
    ${g?`<p class="hint">${t('win.wait')}</p><nav class="menu"><button class="danger" data-a="netleave">${t('leaveroom')}</button></nav>`:`<nav class="menu">${r.i<5?`<button class="pri" data-a="next:${r.i+1}">${t('next')}</button>`:''}<button data-a="quit">${NET.on?t('stagesel'):t('worldmap')}</button></nav>`}</div>`},
  ending(r){const g=NET.on&&NET.role==='guest';return`<div class="panel narrow win"><h2>${t('end.title')}</h2><div class="grade g${r.grade}">${r.grade}</div><p>${t('end.p')}</p><p class="big">SAM &amp; SYA</p><p class="by">${t('created')}</p><p class="dev">${t('developer')} ${DEVN}</p><nav class="menu">${g?`<button class="danger" data-a="netleave">${t('leaveroom')}</button>`:`<button class="pri" data-a="quit">${NET.on?t('stagesel'):t('worldmap')}</button>`}</nav></div>`},
  mp(){const url=NET.serverURL();return`<div class="panel wide">${hd('net',t('mp.title'))}<p class="hint">${t('mp.hint')}</p>
    <div class="mpg"><section class="mpc"><h3>${t('local.h')}</h3><p>${t('local.p')}</p><button class="pri" data-a="lhost">${t('host')}</button><button data-a="ljoin">${t('join')}</button></section>
    <section class="mpc"><h3>${t('online.h')}</h3><p>${t('online.p')}</p><button class="pri" data-a="ohost">${t('create')}</button><button data-a="go:ojoin">${t('joincode')}</button></section>
    <section class="mpc"><h3>${t('same.h')}</h3><p>${t('same.p')}</p><button data-a="couch">${t('mode.2')}</button></section></div>
    <details class="srv"><summary>${t('srv.sum')}</summary><p class="hint">${t('srv.p',{u:'<b>'+esc(url||t('notset'))+'</b>'})}</p>
    <div class="row"><input id="srvIn" value="${esc(SAVE.set.srv||'')}" placeholder="wss://your-server/ws or ws://192.168.43.1:8787/ws" autocomplete="off"><button data-a="srv">${t('save')}</button></div></details>
    <div class="row end"><button data-a="back">${t('back')}</button></div></div>`},
  lhost(){const c=NET.offerCode,re=NET.inGame;return`<div class="panel"><h2>${re?t('lh.re'):t('lh.title')}</h2>
    <ol class="steps"><li>${t('lh.s1')}</li><li>${t('lh.s2')}</li><li>${t('lh.s3')}</li><li>${t('lh.s4')}</li></ol>
    <div class="qrbox" id="qrO">${c?'':`<p class="hint">${t('creating')}</p>`}</div>
    ${c?`<details><summary>${t('cantscan')}</summary><textarea readonly id="codeO" rows="3">${esc(c)}</textarea><div class="row"><button data-a="copy:codeO">${t('copy')}</button><button data-a="share:codeO">${t('share')}</button></div></details>
    <div class="row"><button class="pri" data-a="scanA">${t('scanA')}</button></div><textarea id="pasteA" rows="2" placeholder="${t('pasteA')}"></textarea><div class="row"><button data-a="pasteA">${t('connect')}</button></div>`:''}
    <p class="hint" id="netst">${esc(tx(NET.status))}</p><div class="row end"><button data-a="netleave">${re?t('leaveroom'):t('cancel')}</button></div></div>`},
  ljoin(){const a=NET.answerCode;return`<div class="panel"><h2>${t('lj.title')}</h2>
    ${a?`<ol class="steps"><li>${t('lj.a1')}</li><li>${t('lj.a2')}</li></ol><div class="qrbox" id="qrA"></div>
      <details><summary>${t('cantscan')}</summary><textarea readonly id="codeA" rows="3">${esc(a)}</textarea><div class="row"><button data-a="copy:codeA">${t('copy')}</button><button data-a="share:codeA">${t('share')}</button></div></details>`
    :`<ol class="steps"><li>${t('lj.s1')}</li><li>${t('lj.s2')}</li></ol><div class="row"><button class="pri" data-a="scanO">${t('scanO')}</button></div>
      <textarea id="pasteO" rows="2" placeholder="${t('pasteO')}"></textarea><div class="row"><button data-a="pasteO">${t('continue')}</button></div>`}
    <p class="hint" id="netst">${esc(tx(NET.status))}</p><div class="row end"><button data-a="netleave">${t('cancel')}</button></div></div>`},
  ojoin(){return`<div class="panel narrow"><h2>${t('oj.title')}</h2><p>${t('oj.p')}</p><input id="codeIn" class="code" maxlength="5" value="${esc(this.joinCode)}" autocapitalize="characters" autocomplete="off" placeholder="ABCDE">
    <nav class="menu"><button class="pri" data-a="joincode">${t('joinroom')}</button><button data-a="back">${t('back')}</button></nav><p class="hint">${t('server',{u:esc(NET.serverURL()||t('notset'))})}</p></div>`},
  room(){const me=NET.role==='host'?0:1,h=NET.hero,o=h==='sam'?'sya':'sam',R=NET.rdy,host=NET.role==='host';
    const slot=(i,ch,who)=>`<div class="slot ${R[i]?'rd':''}" style="--c:${HERO[ch].col}"><img src="${portraitURL(ch)}" alt=""><div><small>${t('pn',{n:i+1})}${i===0?' \u00b7 Host':''}${i===me?' \u00b7 '+t('you'):''}</small><b>${HERO[ch].name}</b><span>${esc(who)}</span></div><i>${R[i]?t('ready').toUpperCase():i===1&&!NET.peer?'\u2026':'\u2014'}</i></div>`;
    const hn=host?NET.name:NET.pname||'Host',gn=NET.peer?(host?NET.pname||t('partner'):NET.name):t('waitp');
    return`<div class="panel">${hd('net',NET.mode==='local'?t('room.local'):NET.code?t('room.code',{c:esc(NET.code)}):t('room.online'),`<span class="tag">${NET.peer?t('connected')+(NET.rtt?' \u00b7 '+NET.rtt+' ms':''):t('notconn')}</span>`)}
    <div class="slots">${slot(0,h,hn)}${slot(1,o,gn)}</div>
    ${host?`<div class="row"><span class="lb">${t('youplay')}</span><button class="seg ${h==='sam'?'on':''}" data-a="hero:sam">SAM</button><button class="seg ${h==='sya'?'on':''}" data-a="hero:sya">SYA</button></div><p class="hint">${t('p2auto')}</p>`:''}
    <div class="row"><button class="${R[me]?'seg on':'pri'}" data-a="ready" ${NET.peer?'':'disabled'}>${t('ready')}${R[me]?' \u2713':''}</button>
    ${host?`<button class="pri" data-a="netstart" ${NET.peer&&R[0]&&R[1]?'':'disabled'}>${t('choose')}</button>`:''}${host&&NET.mode==='online'&&NET.code?`<button data-a="invite">${t('invite')}</button>`:''}</div>
    <p class="hint" id="netst">${esc(tx(NET.status)||(host?(NET.peer?t('hostready'):NET.mode==='online'&&NET.code?t('sharecode',{c:NET.code}):''):t('guestwait')))}</p>
    <div class="row end"><button class="danger" data-a="netleave">${t('leaveroom')}</button></div></div>`},
  netlost(){const host=NET.role==='host';return`<div class="panel narrow"><h2>${t('nl.title')}</h2><p>${esc(tx(NET.status)||t('nl.drop'))}</p>
    <p class="hint">${NET.mode==='online'?t('nl.online'):host?t('nl.host'):t('nl.guest')}</p>
    <nav class="menu">${NET.mode==='local'?(host?`<button class="pri" data-a="rehost">${t('newinvite')}</button>`:`<button class="pri" data-a="ljoin">${t('scannew')}</button>`):''}${host?`<button data-a="solo">${t('solo')}</button>`:''}<button class="danger" data-a="netleave">${t('leaveroom')}</button></nav></div>`},
  account(){const u=CLOUD.user,cfg=CLOUD.configured();
    if(u)return`<div class="panel">${hd('cloud',t('acc.title'))}<div class="acct">${u.photoURL?`<img src="${esc(u.photoURL)}" alt="" referrerpolicy="no-referrer">`:''}<div><b>${esc(u.displayName||t('player'))}</b><small>${esc(u.email||'')}</small><small>${t('pid',{id:esc(u.uid.slice(0,12))})}</small></div></div>
      <p>${t('acc.sync')}</p><p class="hint">${CLOUD.last?t('acc.last',{t:new Date(CLOUD.last).toLocaleTimeString()}):t('acc.notyet')}${navigator.onLine?'':t('acc.off')}${CLOUD.err?' \u00b7 '+esc(tx(CLOUD.err)):''}</p>
      <div class="row"><button class="pri" data-a="cpush">${t('acc.push')}</button><button data-a="cpull">${t('acc.pull')}</button><button data-a="logout">${t('acc.out')}</button></div><div class="row end"><button data-a="back">${t('back')}</button></div></div>`;
    return`<div class="panel">${hd('cloud',t('acc.title'))}<div class="acct"><img src="${portraitURL(SAVE.char||'sam')}" alt=""><div><b>${t('guest')}</b><small>${t('pid',{id:esc(CLOUD.guestId())})}</small></div></div>
      <p>${t('acc.guest')}</p><div class="row"><button class="pri" data-a="login" ${cfg&&CLOUD.st!=='loading'&&CLOUD.st!=='offline'?'':'disabled'}>${t('acc.in')}</button></div>
      ${!cfg?`<p class="hint">${t('acc.nocfg')}</p>`:CLOUD.st==='offline'?`<p class="hint">${t('acc.gfail')}</p>`:''}
      <h3>${t('acc.name')}</h3><div class="row"><input id="gnIn" maxlength="16" value="${esc(SAVE.set.gname||'')}" placeholder="${t('player')}" autocomplete="off"><button data-a="gname">${t('save')}</button></div>
      <div class="row end"><button data-a="back">${t('back')}</button></div></div>`},
  conflict(){const c=CLOUD.conflict;if(!c)return this.S.title.call(this);const a=CLOUD.summary(SAVE),b=CLOUD.summary(c.cloud),card=(tt,s)=>`<div class="mpc"><h3>${tt}</h3><p>${t('cf.sum',{l:s.lvl,s:Math.min(6,s.prog),g:s.gold,a:s.ach})}</p></div>`;
    return`<div class="panel"><h2>${t('cf.title')}</h2><p>${t('cf.p')}</p><div class="mpg">${card(t('cf.dev'),a)}${card(t('cf.cloud',{d:new Date(c.client).toLocaleDateString()}),b)}</div>
      <div class="row end"><button data-a="keepLocal">${t('cf.keep')}</button><button class="pri" data-a="useCloud">${t('cf.use')}</button></div></div>`},
});

window.DBG={G,IN,UI,NET,CLOUD,QR,startLevel,step,tick,sdpPack,sdpUnpack,get SAVE(){return SAVE},HERO,ENEMY};
NET.install();
boot().then(()=>{CLOUD.init();const rp=new URLSearchParams(location.search).get('room');if(rp){UI.joinCode=rp.toUpperCase().slice(0,5);UI.show('ojoin')}});

</script>
<script>
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
