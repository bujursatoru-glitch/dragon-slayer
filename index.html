<style>
:root{--vh:1vh;--vw:1vw}
html.vrot body{position:fixed;left:0;top:0;transform-origin:0 0;overflow:hidden;margin:0}

:root{--ink:#120e1c;--panel:#221a34;--panel2:#30264a;--gold:#f2b63d;--crimson:#c8322b;--parch:#f0e3c2;--dim:#a898b8;--sam:#5c9bd6;--sya:#ff8a3c;--disp:"Press Start 2P","Courier New",monospace;--body:"Pixelify Sans","Trebuchet MS",Verdana,sans-serif;color-scheme:dark}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#120e1c;--panel:#221a34}}
:root[data-theme="dark"]{--ink:#120e1c;--panel:#221a34}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#07050c;color:var(--parch);font-family:var(--body);font-size:16px;line-height:1.4;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:none;overscroll-behavior:none}

#touch{position:fixed;left:0;right:0;bottom:0;top:0;z-index:5;display:none;touch-action:none;--op:.6;padding-bottom:env(safe-area-inset-bottom,0px)}
#touch.show{display:block}

.tb{font-family:var(--disp);color:var(--parch);background:rgba(26,18,40,.72);border:3px solid var(--gold);box-shadow:0 0 0 2px #120e1c,inset 0 -5px 0 rgba(0,0,0,.35);padding:0;letter-spacing:0;touch-action:none}
.tb.dn{background:var(--gold);color:#120e1c;transform:translate(-50%,-46%)!important}
.tb[data-b="atk"]{border-color:#ff6a5a}.tb[data-b="ult"]{border-color:#ffe27a;color:#ffe27a}.tb[data-b="spc"]{border-color:#7ad4ff}.tb[data-b="potion"]{border-color:#ff8a9a}
#joy{border:3px solid rgba(240,227,194,.55);background:rgba(26,18,40,.4);box-shadow:0 0 0 2px #120e1c;pointer-events:none}
#touch.edit #joy{pointer-events:auto}
#joy i{position:absolute;left:50%;top:50%;width:44%;height:44%;margin:-22% 0 0 -22%;border-radius:50%;background:var(--parch);box-shadow:0 0 0 3px #120e1c}
#touch.edit>[data-k]{outline:2px dashed #fff;outline-offset:4px;opacity:1}
.rot{display:none;position:absolute;left:0;right:0;bottom:calc(8px + env(safe-area-inset-bottom,0px));text-align:center;font-size:13px;color:var(--dim);pointer-events:none}

body.port #touch{background:linear-gradient(#1a1228,#0c0814)}
#pauseBtn{position:fixed;z-index:6;top:calc(6px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);width:44px;height:32px;display:none;font-family:var(--disp);font-size:10px;color:var(--parch);background:rgba(26,18,40,.7);border:2px solid var(--gold)}
#pauseBtn.show{display:block}
#ui{position:fixed;inset:0;z-index:10;display:none;overflow:auto;touch-action:pan-y;padding:calc(12px + env(safe-area-inset-top,0px)) 12px calc(12px + env(safe-area-inset-bottom,0px))}
#ui.on{display:flex;align-items:center;justify-content:center;background:rgba(10,6,18,.78)}
#ui.s-title{background:linear-gradient(rgba(10,6,18,.15),rgba(10,6,18,.55))}

.editbar{pointer-events:auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center;background:var(--panel);border:3px solid var(--gold);padding:8px 12px;font-size:14px}
button{font-family:var(--disp);font-size:10px;line-height:1.5;color:var(--parch);background:var(--panel2);border:0;padding:11px 14px;cursor:pointer;box-shadow:0 -3px 0 #4a3c6e,0 3px 0 #120e1c,-3px 0 0 #120e1c,3px 0 0 #120e1c;margin:3px;touch-action:manipulation}

button.seg.on{background:var(--crimson);box-shadow:0 -3px 0 #ff6a5a,0 3px 0 #5a1210,-3px 0 0 #5a1210,3px 0 0 #5a1210}
h2{font-family:var(--disp);font-size:15px;color:var(--gold);line-height:1.5;text-shadow:2px 2px 0 #120e1c}

.l1{font-family:var(--disp);font-size:clamp(26px,calc(8.4 * var(--vw)),62px);color:#fff;text-shadow:0 4px 0 var(--crimson),0 8px 0 #5a1210,4px 0 0 #120e1c,-4px 0 0 #120e1c,0 -4px 0 #120e1c,4px 12px 0 #120e1c,-4px 12px 0 #120e1c;letter-spacing:.02em}

.menu{display:flex;flex-direction:column;gap:4px;min-width:min(280px,calc(80 * var(--vw)))}

.panel{background:var(--panel);width:min(560px,100%);max-height:100%;overflow:auto;padding:16px;box-shadow:0 -4px 0 var(--gold),0 4px 0 var(--gold),-4px 0 0 var(--gold),4px 0 0 var(--gold),0 0 0 8px #120e1c;margin:10px;touch-action:pan-y}
.panel.wide{width:min(860px,100%)}.panel.narrow{width:min(380px,100%);text-align:center}
.panel p{margin:8px 0;max-width:64ch}.panel.narrow p{margin-left:auto;margin-right:auto}
.bar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.res{display:flex;gap:12px;font-size:15px;margin:0!important}.res b{font-weight:600}.res .g{color:var(--gold)}.res .p{color:#ff8a9a}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:2px;margin:10px 0 0}.row.end{justify-content:flex-end}
.lb,.sum{font-size:14px;color:var(--dim);margin:0 8px}
.hint{font-size:14px;color:var(--dim)}.big{font-family:var(--disp);font-size:14px;color:#fff;margin:14px 0!important}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:10px}
.card{background:#1a1428;padding:10px;display:flex;gap:10px;box-shadow:inset 0 0 0 3px #3a2e58}
.card.on{box-shadow:inset 0 0 0 3px var(--c)}
.card canvas{width:120px;height:102px;image-rendering:pixelated;background:#120e1c;flex:none}
.ci{flex:1;min-width:0}.ci h3{margin:0 0 4px;color:var(--c);font-size:13px}.ci p{font-size:14px;margin:2px 0 6px}.sk{color:var(--dim)}
.stats label{display:flex;align-items:center;justify-content:space-between;font-size:13px;gap:8px}
.stats span{flex:0 0 55%;height:6px;background:#120e1c}.stats i{display:block;height:100%;background:var(--c)}
.stages{list-style:none;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:6px}
.stage{width:calc(100% - 6px);display:grid;grid-template-columns:auto 1fr auto;column-gap:10px;text-align:left;align-items:center;padding:10px}
.stage b{grid-row:span 2;font-size:18px;color:var(--gold)}.stage .nm{font-size:10px}.stage .bs{grid-column:2;font-family:var(--body);font-size:13px;color:var(--dim)}
.stage .gr{grid-column:3;grid-row:1/3;font-style:normal;font-size:16px;color:#7af0ff}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:4px 18px}.cols.three{grid-template-columns:repeat(3,1fr)}
.items,.ach{list-style:none;padding:0}

.items li.on{border-left-color:var(--gold)}.items li.leg b{color:#c9a2ff}

.acts{display:flex;flex-direction:column;align-items:flex-end;flex:none}.acts button{font-size:8px;padding:8px}
.tag{font-size:13px;color:var(--gold);padding:0 6px}.tag.dim{color:var(--dim)}
.pips{display:flex;gap:4px;margin-top:4px}.pips i{width:12px;height:6px;background:#120e1c}.pips i.on{background:var(--gold)}

.ach li{background:#1a1428;padding:6px 8px;opacity:.5;border-left:4px solid #3a2e58}.ach li.on{opacity:1;border-left-color:var(--gold)}
.ach b{display:block;font-size:15px;font-weight:600}.ach small{font-size:13px;color:var(--dim)}
.sl{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:15px;margin:8px 0}
input[type=range]{flex:0 0 55%;accent-color:var(--gold);height:24px;touch-action:pan-x}
.load{text-align:center;width:min(440px,calc(92 * var(--vw)))}.load .line{color:var(--parch);margin:10px auto;max-width:44ch}.load .tip{color:var(--dim);font-size:15px;margin-top:14px;min-height:3em}
#lbar{height:14px;background:#120e1c;box-shadow:0 0 0 3px var(--gold);margin:16px 6px}#lbar i{display:block;height:100%;width:0;background:var(--crimson);box-shadow:inset 0 3px 0 #ff6a5a}
.grade{font-family:var(--disp);font-size:54px;color:#fff;margin:10px 0;text-shadow:0 5px 0 var(--crimson),5px 0 0 #120e1c,-5px 0 0 #120e1c,0 10px 0 #120e1c,0 -5px 0 #120e1c}
.gS{color:var(--gold)}.over h2{color:#ff6a5a}
dl{display:grid;grid-template-columns:1fr auto;gap:2px 16px;text-align:left;font-size:15px;margin:8px 0 12px}dd{text-align:right;color:var(--gold);margin:0}
#toasts{position:fixed;z-index:20;top:calc(44px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;pointer-events:none;align-items:center}
.toast{background:var(--panel);box-shadow:0 0 0 3px var(--gold),0 0 0 6px #120e1c;padding:6px 12px;text-align:center;animation:tin .25s steps(4) both}
.toast b{display:block;font-family:var(--disp);font-size:8px;color:var(--gold)}.toast span{font-size:14px}
@keyframes tin{from{transform:translateY(-20px);opacity:0}}
@media (max-width:640px){.cards,.cols,.cols.three{grid-template-columns:1fr}.card canvas{width:96px;height:82px}h2{font-size:12px}}
@media (max-height:420px){.panel{padding:10px}.title{gap:8px}.menu button{padding:8px}.l1{font-size:clamp(22px,calc(10 * var(--vh)),44px)}.l2{margin-top:8px;font-size:clamp(10px,calc(4.4 * var(--vh)),18px)}.cards{grid-template-columns:1fr 1fr}.card canvas{width:80px;height:68px}}
#touch{left:env(safe-area-inset-left,0px);right:env(safe-area-inset-right,0px)}
#toasts{max-width:min(calc(92 * var(--vw)),420px)}.toast{padding:4px 10px}.toast span{font-size:13px}
.dev{font-family:var(--disp);font-size:7px;color:var(--dim);letter-spacing:.14em;text-shadow:2px 2px 0 #120e1c;margin-top:-10px!important}
#fsBtn{position:fixed;z-index:6;top:calc(6px + env(safe-area-inset-top,0px));left:calc(50% + 28px);width:36px;height:32px;display:none;padding:0;background:rgba(26,18,40,.7);border:2px solid var(--gold);box-shadow:none;margin:0}
#fsBtn.show{display:block}#fsBtn svg{width:16px;height:16px;display:block;margin:auto}
#netchip{position:fixed;z-index:6;top:calc(8px + env(safe-area-inset-top,0px));right:calc(50% + 30px);display:none;align-items:center;gap:5px;font-family:var(--disp);font-size:7px;color:var(--parch);background:rgba(26,18,40,.72);padding:6px 7px;border:2px solid #3a2e58;pointer-events:none}
#netchip.on{display:flex}#netchip i{width:6px;height:6px;background:#e8455a}#netchip i.ok{background:#7aff9a}
#rotate{position:fixed;inset:0;z-index:30;display:none;align-items:center;justify-content:center;background:rgba(7,5,12,.94);text-align:center;padding:20px}
#rotate.on{display:flex}#rotate .rbox{display:flex;flex-direction:column;align-items:center;gap:14px;max-width:320px}
#rotate .phone{width:44px;height:76px;border:4px solid var(--gold);box-shadow:0 0 0 3px #120e1c;position:relative;animation:rot 2.4s steps(8) infinite}

@keyframes rot{0%,30%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}

#scan{position:fixed;inset:0;z-index:40;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:#07050c;padding:16px}
#scan.on{display:flex}#scan video{width:min(calc(88 * var(--vw)),calc(70 * var(--vh)),420px);aspect-ratio:1;object-fit:cover;border:4px solid var(--gold);box-shadow:0 0 0 4px #120e1c;background:#120e1c}

.mpg{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin:10px 0}
.mpc{background:#1a1428;padding:10px;box-shadow:inset 0 0 0 3px #3a2e58;display:flex;flex-direction:column;gap:4px}
.mpc h3{margin:0 0 2px;color:var(--gold)}.mpc p{font-size:14px;color:var(--dim);margin:0 0 6px!important;flex:1}.mpc button{width:calc(100% - 6px)}
.steps{margin:8px 0 8px 20px;padding:0;font-size:14px}.steps li{margin:3px 0}
.qrbox{display:flex;justify-content:center;margin:10px 0;min-height:40px}.qrbox canvas{width:min(calc(64 * var(--vw)),calc(52 * var(--vh)),250px);height:auto;image-rendering:pixelated;box-shadow:0 0 0 4px var(--gold),0 0 0 8px #120e1c}
textarea,input[type=text],input:not([type]){width:100%;font-family:var(--body);font-size:14px;color:var(--parch);background:#120e1c;border:2px solid #3a2e58;padding:8px;margin:6px 0;resize:vertical;user-select:text;-webkit-user-select:text;touch-action:auto}

/* ===== VISUAL OVERHAUL 2.0 ===== */
.panel{background-color:#221a34;background-image:repeating-linear-gradient(0deg,rgba(255,255,255,.018) 0 2px,transparent 2px 4px);animation:pin .24s steps(4) both}

.logo{display:flex;flex-direction:column;align-items:center}

.cloudchip i,.cstat i{flex:none;width:7px;height:7px;background:var(--dim)}
.cloudchip span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.s-ok i{background:#7aff9a}.s-busy i{background:var(--gold);animation:cblink .9s steps(2) infinite}.s-warn i{background:#ffb347}.s-bad i{background:#e8455a}

.cstat{display:flex;align-items:center;gap:8px}

.langchip{position:fixed;z-index:12;top:calc(10px + env(safe-area-inset-top,0px));right:calc(10px + env(safe-area-inset-right,0px));display:flex;align-items:center;font-size:9px;padding:8px 10px}
.langs button{display:flex;align-items:center;font-size:10px}
/* map */
.stages2{list-style:none;padding:0;display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:6px 0}
.stg{width:calc(100% - 6px);display:flex;flex-direction:column;align-items:stretch;text-align:left;padding:6px;gap:4px}
.stg .sc{position:relative;display:block;aspect-ratio:64/36;background:#120e1c;box-shadow:0 0 0 2px #120e1c}
.stg .sc img{width:100%;height:100%;image-rendering:pixelated;display:block}
.stg .sc b{position:absolute;left:5px;top:4px;font-size:12px;color:var(--gold);text-shadow:2px 2px 0 #120e1c}
.stg .sc .gr{position:absolute;right:5px;top:4px;font-style:normal;font-size:12px;color:#7af0ff;text-shadow:2px 2px 0 #120e1c}.stg .sc .gr.gS{color:var(--gold)}
.stg .nm{font-size:9px;line-height:1.4}.stg .bs{font-family:var(--body);font-size:12px;color:var(--dim)}
.stg.lk .sc>img:first-child{filter:grayscale(1) brightness(.4)}.stg .sc img.lki{position:absolute;left:50%;top:50%;width:32px;height:32px;margin:-16px}
.stg:not(:disabled):hover .sc{box-shadow:0 0 0 2px var(--gold)}
@media (max-width:640px){.stages2{grid-template-columns:repeat(2,1fr)}}
@media (max-height:520px) and (min-width:700px){.stages2{grid-template-columns:repeat(6,1fr);gap:6px}.stg .nm{font-size:8px}.stg .bs{font-size:11px}}
/* inventory, achievements */
.items li{gap:10px}.items li .tx{flex:1;min-width:0}
.ach li{display:flex;align-items:center;gap:10px}.ach li.on{background:#211a33}.ach li .ic{width:36px;height:36px}.ach li .ic img{width:28px;height:28px}
/* skill tree */
.tree{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:6px}.br{display:flex;flex-direction:column;align-items:stretch}.br h3{margin:4px 0 8px}
.node{display:flex;align-items:center;gap:10px;text-align:left;padding:6px 8px;width:calc(100% - 6px);font-family:var(--body);font-size:14px}
.node .nt b{display:block;font-family:var(--disp);font-size:9px;line-height:1.5}.node.got{background:#3a2e5c}
.node.max .ic{box-shadow:inset 0 0 0 2px var(--gold),0 0 10px rgba(242,182,61,.5)}.node.sel{outline:3px solid var(--gold);outline-offset:1px}
.node:hover .ic img,.node.sel .ic img{animation:icp .45s steps(3) infinite alternate}@keyframes icp{to{transform:translateY(-2px)}}
.link{display:block;width:4px;height:8px;margin:0 0 0 27px;background:#3a2e58}.link.on{background:var(--gold)}
.skdet{display:flex;align-items:center;gap:12px;margin-top:12px;padding:10px;background:#140f20;box-shadow:inset 0 0 0 2px #3a2e58}
.skdet .tx{flex:1;min-width:0}.skdet b{font-family:var(--disp);font-size:11px;color:var(--gold)}.skdet small{display:block;color:var(--dim);font-size:13px}.skdet p{margin:4px 0 0!important;font-size:15px}
@media (max-width:640px){.tree{grid-template-columns:1fr}}
/* character select */
.card.hero{align-items:flex-start}
.pvw{position:relative;flex:none;width:168px;height:176px;overflow:hidden;background:radial-gradient(circle at 50% 72%,color-mix(in srgb,var(--c) 32%,#120e1c) 0,#120e1c 72%);box-shadow:inset 0 0 0 2px #3a2e58}
.pvw .art{position:absolute;left:0;top:4px;width:100%;height:100%;object-fit:contain;object-position:50% 0;image-rendering:pixelated;filter:drop-shadow(0 0 6px color-mix(in srgb,var(--c) 55%,transparent))}
.card .pvw canvas{position:absolute;right:4px;bottom:4px;width:64px;height:56px;background:rgba(18,14,28,.78);box-shadow:0 0 0 2px var(--c);image-rendering:pixelated}
.pvw .port{display:none}
.stats label{gap:6px}.stats em{font-style:normal;flex:1}.stats span{flex:0 0 40%}.stats b{font-family:var(--disp);font-size:9px;color:var(--c);width:14px;text-align:right}
@media (max-height:420px),(max-width:640px){.pvw{width:120px;height:126px}.card .pvw canvas{width:48px;height:42px}}
.slot img,.acct img{image-rendering:pixelated}
/* loading card */
.load img.scene{width:min(256px,calc(60 * var(--vw)));aspect-ratio:64/36;image-rendering:pixelated;display:block;margin:0 auto 12px;box-shadow:0 0 0 3px var(--gold),0 0 0 6px #120e1c}
/* touch buttons: icon + label */
.tb{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;line-height:1}
.tb img{width:44%;height:auto;image-rendering:pixelated;pointer-events:none}.tb s{text-decoration:none;font-size:.8em;pointer-events:none}.tb.dn img{filter:brightness(.25)}
/* notifications 2.0 */
#toasts{top:calc(46px + env(safe-area-inset-top,0px));gap:6px}
.note{--nc:var(--gold);position:relative;display:flex;align-items:center;gap:10px;min-width:190px;max-width:min(calc(88 * var(--vw)),340px);padding:6px 12px 6px 6px;background:linear-gradient(90deg,color-mix(in srgb,var(--nc) 24%,#1a1428),#1a1428 70%);box-shadow:0 0 0 2px var(--nc),0 0 0 5px #120e1c,0 7px 0 4px rgba(0,0,0,.3);animation:nin .32s steps(5) both;overflow:hidden}
.note img{width:32px;height:32px;image-rendering:pixelated;flex:none}
.note b{display:block;font-family:var(--disp);font-size:9px;color:var(--nc);line-height:1.6}.note span{display:block;font-size:13px;color:var(--parch)}
.note.out{animation:nout .26s steps(4) forwards}.note.bump img{animation:nb .3s steps(3)}
.note.burst::after{content:'';position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.35) 45%,transparent 60%);transform:translateX(-100%);animation:shine .9s steps(9) .2s;pointer-events:none}
.note.burst img{animation:icp .35s steps(3) 6 alternate}
.note.k-gold{min-width:0;padding:3px 10px 3px 4px}.note.k-gold img{width:22px;height:22px}
.note.k-lowhp{animation:nin .32s steps(5) both,hb .5s steps(2) .3s 3}
@keyframes nin{0%{transform:translateY(-18px) scale(.92);opacity:0}70%{transform:translateY(2px) scale(1.02);opacity:1}100%{transform:none}}
@keyframes nout{to{transform:translateY(-12px);opacity:0}}@keyframes nb{50%{transform:scale(1.3)}}@keyframes shine{to{transform:translateX(100%)}}
@keyframes hb{50%{box-shadow:0 0 0 2px #fff,0 0 0 5px #120e1c}}
@media (prefers-reduced-motion:reduce){.panel,.load,.title .menu,.credits .roll,.note,.note img,.node .ic img{animation:none!important}}

.lb{list-style:none;margin:8px 0;padding:0;display:flex;flex-direction:column;gap:4px}.lb li{display:flex;align-items:center;gap:10px;padding:5px 10px;background:rgba(26,16,46,.6);border:1px solid #3a2a5a;font-size:12px}.lb li.me{border-color:#f2b63d;background:rgba(60,40,20,.6)}.lb li b{width:2em;color:#ffe27a}.lb li span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.lb li i{font-style:normal;color:#9ae8ff}.lb .sb-port{width:30px;height:35px}

<script>
'use strict';
/* ===== LOCALIZATION: one table per language (locales/en.json, locales/id.json, embedded above) ===== */
const LOC={en:{},id:{}};for(const l of['en','id']){try{LOC[l]=JSON.parse(document.getElementById('locale-'+l).textContent)}catch(e){}}
(function(){if(!/^https?:$/.test(location.protocol))return;for(const l of['en','id'])fetch('locales/'+l+'.json',{cache:'no-cache'}).then(r=>r.ok?r.json():null).then(j=>{if(j)Object.assign(LOC[l],j)}).catch(()=>{})})();
let LANG='en';
function setLang(l){LANG=(l==='id'||l==='en')?l:'en';document.documentElement.lang=LANG}
function t(k,v){let s=LOC[LANG][k];if(s==null)s=LOC.en[k];if(s==null)return k;if(v)s=s.replace(/\{(\w+)\}/g,(m,n)=>v[n]!=null?v[n]:m);return s}
const TXR=[[/^Joining room (\w+)\u2026?$/,'p.joining',m=>({c:m[1]})],[/^Secrets found: (\d+) of (\d+)$/,'p.secrets',m=>({a:m[1],b:m[2]})]];
function tx(s){if(s==null||s===''||LANG==='en')return s;s=String(s);const P=LOC[LANG]._phrase||{};if(P[s]!=null)return P[s];for(const[r,k,f]of TXR){const m=s.match(r);if(m)return t(k,f(m))}return s}
function trc(s){if(LANG==='en'||typeof s!=='string')return s;const C=LOC[LANG]._canvas||{};if(C[s]!=null)return C[s];const m=s.match(/^\+(\d+) POTION$/);return m?t('c.potion',{n:m[1]}):s}
const NM={sword:i=>t('sw.'+i),swordD:i=>t('sw.'+i+'.d'),armor:i=>t('ar.'+i),armorD:i=>t('ar.'+i+'.d'),skill:i=>t('sk.'+i),skillD:i=>t('sk.'+i+'.d'),ach:i=>t('ac.'+i),achD:i=>t('ac.'+i+'.d'),
  stage:i=>t('st.'+i),line:i=>t('st.'+i+'.l'),enemy:k=>t('en.'+k),bossD:k=>{const v=t('en.'+k+'.d');return v==='en.'+k+'.d'?'':v},tip:()=>t('tip.'+(Math.random()*12|0))};
/* ===== SAM & SYA: DRAGON SLAYER  |  core utilities ===== */
const TAU=Math.PI*2,DEG=Math.PI/180,TPF=3,TILE=16;
const clamp=(v,a,b)=>v<a?a:v>b?b:v,lerp=(a,b,t)=>a+(b-a)*t;
const rnd=(a=1,b)=>b===undefined?Math.random()*a:a+Math.random()*(b-a);
const rndi=(a,b)=>Math.floor(rnd(a,b+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const chance=p=>Math.random()<p;
function mulberry(s){return function(){s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const hex=h=>{const n=parseInt(h.slice(1),16);return(0xff000000|((n&255)<<16)|(n&0xff00)|((n>>16)&255))>>>0};
const css=c=>'#'+((c&255)<<16|(c&0xff00)|(c>>16&255)).toString(16).padStart(6,'0');
const mul=(c,f)=>{const r=clamp((c&255)*f,0,255)|0,g=clamp((c>>8&255)*f,0,255)|0,b=clamp((c>>16&255)*f,0,255)|0;return(0xff000000|b<<16|g<<8|r)>>>0};
const mixc=(a,b,t)=>{const r=lerp(a&255,b&255,t)|0,g=lerp(a>>8&255,b>>8&255,t)|0,bl=lerp(a>>16&255,b>>16&255,t)|0;return(0xff000000|bl<<16|g<<8|r)>>>0};
const RAMP=new Map();
/* register a 3-tone material; pixels drawn in `base` get top-lit shading automatically */
function mat(base,hi,sh){const b=hex(base);RAMP.set(b,[hi?hex(hi):mul(b,1.28),sh?hex(sh):mul(b,.68)]);return b}
const OUTL=hex('#1a1224');
function mkCanvas(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c}
function ctx2d(c){const x=c.getContext('2d');x.imageSmoothingEnabled=false;return x}

/* ---- pixel buffer: every sprite in the game is plotted through this ---- */
class PB{
  constructor(w,h){this.w=w;this.h=h;this.d=new Uint32Array(w*h);this.rb()}
  rb(){this.x0=this.w;this.y0=this.h;this.x1=-1;this.y1=-1}
  clear(){if(this.x1>=0){for(let y=this.y0;y<=this.y1;y++)this.d.fill(0,y*this.w+this.x0,y*this.w+this.x1+1)}this.rb()}
  set(x,y,c){x=Math.round(x);y=Math.round(y);if(x<0||y<0||x>=this.w||y>=this.h)return;this.d[y*this.w+x]=c;if(x<this.x0)this.x0=x;if(x>this.x1)this.x1=x;if(y<this.y0)this.y0=y;if(y>this.y1)this.y1=y}
  get(x,y){return x<0||y<0||x>=this.w||y>=this.h?0:this.d[y*this.w+x]}
  rect(x,y,w,h,c){x=Math.round(x);y=Math.round(y);for(let j=0;j<h;j++)for(let i=0;i<w;i++)this.set(x+i,y+j,c)}
  stamp(x,y,t,c){x=Math.round(x);y=Math.round(y);
    if(t<=1)this.set(x,y,c);
    else if(t===2){this.set(x,y,c);this.set(x+1,y,c);this.set(x,y+1,c);this.set(x+1,y+1,c)}
    else if(t===3){this.set(x,y,c);this.set(x-1,y,c);this.set(x+1,y,c);this.set(x,y-1,c);this.set(x,y+1,c)}
    else{const r=t/2,r2=r*r;for(let j=-Math.ceil(r);j<=r;j++)for(let i=-Math.ceil(r);i<=r;i++)if((i+.0)*(i+.0)+(j+.0)*(j+.0)<=r2+.3)this.set(x+i,y+j,c)}}
  line(x0,y0,x1,y1,c,t=1){const dx=x1-x0,dy=y1-y0,n=Math.max(1,Math.ceil(Math.max(Math.abs(dx),Math.abs(dy))));for(let i=0;i<=n;i++)this.stamp(x0+dx*i/n,y0+dy*i/n,t,c)}
  disc(cx,cy,r,c){this.ell(cx,cy,r,r,c)}
  ell(cx,cy,rx,ry,c){for(let j=-Math.ceil(ry);j<=ry;j++)for(let i=-Math.ceil(rx);i<=rx;i++)if(i*i/(rx*rx+.01)+j*j/(ry*ry+.01)<=1.05)this.set(cx+i,cy+j,c)}
  poly(pts,c){let ymin=1e9,ymax=-1e9;for(const p of pts){ymin=Math.min(ymin,p[1]);ymax=Math.max(ymax,p[1])}
    for(let y=Math.round(ymin);y<=Math.round(ymax);y++){const xs=[];for(let i=0;i<pts.length;i++){const a=pts[i],b=pts[(i+1)%pts.length];if((a[1]<=y&&b[1]>y)||(b[1]<=y&&a[1]>y))xs.push(a[0]+(y-a[1])/(b[1]-a[1])*(b[0]-a[0]))}
      xs.sort((a,b)=>a-b);for(let i=0;i+1<xs.length;i+=2)for(let x=Math.round(xs[i]);x<=Math.round(xs[i+1]);x++)this.set(x,y,c)}}

/* returns a baking job (resumable) or the finished sheet for an enemy art key */
function enemyArtJob(key){
  let D,fw=EFW,fh=EFH,ox=EOX,oy=EOY;
  if(HUM[key])D=HUM[key]();
  else if(BOSSRIG[key]){D=BOSSRIG[key]();fw=BFW;fh=BFH;ox=BOX;oy=BOY}
  else if(key==='slime')D=creature('slime');
  else if(key==='kingslime'){D=creature('slime',{r:15,big:1,crown:1,col:mat('#3aa8c8','#8ae0f0','#1e6a8a'),hi:hex('#e8ffff')});fw=72;fh=56;ox=36;oy=52}
  else if(key==='bat')D=creature('bat');
  else if(key==='elderbat'){D=creature('bat',{s:2,col:mat('#7a3048','#b85070','#4a1a2c'),wing:mat('#6a2840','#964060','#3e1424'),wing2:mat('#521e32','#6a2840','#2e0e1a'),eye:hex('#ffe060')});fw=72;fh=56;ox=36;oy=52}
  else if(key==='spider')D=creature('spider');
  else if(key==='arachne'){D=creature('spider',{s:3,h:20,col:mat('#3a2a50','#6a5488','#1e1630'),col2:mat('#4a3864','#7a6498','#2a1e40'),mark:hex('#ffb040'),eye:hex('#ffe060')});fw=BFW;fh=BFH;ox=52;oy=BOY}
  if(!D)throw new Error('no art '+key);
  return bakeFrames(D.R,D.A,fw,fh,ox,oy,D.draw);
}

  for(let f=0;f<4;f++){out.push(pbc(S,S,p=>{const c=S/2,s0=a0+(a1-a0)*f*.24,t=th*(1-f*.2);
    for(let y=0;y<S;y++)for(let x=0;x<S;x++){const dx=x-c+.5,dy=y-c+.5,r=Math.hypot(dx,dy);let a=Math.atan2(dx,dy)/DEG;while(a<a0)a+=360;if(a<s0||a>a1)continue;

function ringFrames(R,cols){const out=[];for(let f=0;f<6;f++)out.push(pbc(R*2+2,R*2+2,p=>{const c=R+1,ro=R*(.3+f*.14),ri=ro*(f<2?0:.4+f*.11);

function makeTiles(T,seed){const cv=mkCanvas(16*16,16*4),cx=ctx2d(cv),rng=mulberry(seed||7),F=T.fill.map(hex),C=T.cap.map(hex);
  const fillTile=(p,inner)=>{for(let y=0;y<16;y++)for(let x=0;x<16;x++){let c=F[0];const r=rng();
      if(T.style==='brick'){const row=y>>2,off=(row&1)*4;c=(y&3)===3||((x+off)&7)===7?F[1]:((row*3+((x+off)>>3))%5===0?F[2]:F[0])}
      else if(T.style==='ice'){c=((x+y)%7===0&&r<.7)?F[2]:r<.08?F[1]:F[0]}
      else c=r<.14?F[1]:r<.2?F[2]:F[0];
      p.set(x,y,inner?mul(c,.78):c)}
    if(T.style==='rock'||T.style==='basalt'){let x=rng()*16|0,y=0;const glow=T.style==='basalt'&&!inner&&rng()<.5;for(let i=0;i<14;i++){p.set(x,y,glow?hex(i%3?'#ff7a20':'#ffd060'):mul(F[1],.7));y++;x+=rng()<.5?(rng()<.5?-1:1):0;if(rng()<.2)break}}
    if(T.style==='dirt'&&!inner){const x=2+rng()*11|0,y=6+rng()*8|0;p.set(x,y,F[2]);p.set(x+1,y,F[2]);p.set(x,y+1,mul(F[1],.8));if(rng()<.22){const a=2+rng()*10|0,b=9+rng()*5|0,st=mul(F[1],1.3);p.set(a,b,mul(st,1.25));p.set(a+1,b,st);p.set(a,b+1,st);p.set(a+1,b+1,mul(st,.7))}if(T.key==='forest'&&rng()<.5){let x=rng()*14|0;for(let y=T.capH;y<T.capH+5;y++){p.set(x,y,mul(F[1],.75));if(rng()<.4)x+=rng()<.5?-1:1}}}};
  const edge=mul(F[1],.62);
  for(let v=0;v<2;v++)for(let m=0;m<16;m++){const p=new PB(16,16);fillTile(p,m===0);
    if(m&8)for(let y=0;y<16;y++){p.set(0,y,edge);if(rng()<.5)p.set(1,y,F[1])}
    if(m&2)for(let y=0;y<16;y++){p.set(15,y,edge);if(rng()<.5)p.set(14,y,F[1])}
    if(m&4)for(let x=0;x<16;x++){p.set(x,15,edge);p.set(x,14,F[1])}
    if(m&1)for(let x=0;x<16;x++){const d=T.capH+(rng()<.35?1:0)-(rng()<.3?1:0);for(let y=0;y<d;y++)p.set(x,y,y===0?C[1]:y>=d-1?C[2]:C[0]);if(T.style==='dirt'&&T.key==='forest'&&rng()<.3)p.set(x,d,C[2])}
    p.put(cx,m*16,v*16)}
  const P=T.plat.map(hex),put=(i,fn)=>{const p=new PB(16,16);fn(p);p.put(cx,i*16,32)};
  [0,1,2,3].forEach(i=>put(i,p=>{const x0=i===0||i===3?1:0,x1=i===2||i===3?14:15;for(let x=x0;x<=x1;x++){p.set(x,0,P[1]);p.set(x,1,P[0]);p.set(x,2,P[0]);p.set(x,3,P[0]);p.set(x,4,P[2]);if(x%5===2)p.set(x,2,P[2])}p.set(x0,0,P[0]);p.set(x1,0,P[0]);if(i===0||i===3){p.set(3,5,P[2]);p.set(3,6,P[2]);p.set(4,5,P[2])}if(i===2||i===3){p.set(12,5,P[2]);p.set(12,6,P[2]);p.set(11,5,P[2])}}));
  put(4,p=>{for(let y=0;y<16;y++){p.set(3,y,P[0]);p.set(4,y,P[2]);p.set(11,y,P[0]);p.set(12,y,P[2])}for(const y of[2,7,12]){for(let x=4;x<12;x++){p.set(x,y,P[1]);p.set(x,y+1,P[2])}}});
  put(5,p=>{fillTile(p,0);for(let i=0;i<3;i++){let x=3+i*5,y=1;for(let k=0;k<13;k++){p.set(x,y,mul(F[1],.5));y++;x+=rng()<.5?(rng()<.5?-1:1):0}}p.set(7,7,F[2]);p.set(8,8,F[2]);for(let x=0;x<16;x++){p.set(x,0,mul(F[2],1.1));}});
  put(6,p=>{for(let i=0;i<4;i++){p.poly([[i*4,15],[i*4+3,15],[i*4+1.5,7]],hex('#b8c0d0'));p.line(i*4+1,14,i*4+1,9,hex('#ffffff'));p.set(i*4+3,15,hex('#5a6070'))}});
  const Lq=T.liquid.map(hex);for(let f=0;f<4;f++)put(7+f,p=>{for(let y=3;y<16;y++)for(let x=0;x<16;x++)p.set(x,y,((x*3+y*5+f*4)%23===0)?Lq[1]:y>12?Lq[2]:Lq[0]);for(let x=0;x<16;x++){const h=Math.round(1.2*Math.sin((x+f*4)*TAU/16));p.set(x,3+h,Lq[1]);p.set(x,2+h,x%4===f?Lq[1]:0)}});

const tnoise=(rng,n)=>{const k=[];for(let i=0;i<n;i++)k.push([1+(i*2+(rng()*2|0)),rng()*TAU,1/(1+i*.8)]);return x=>{let v=0,s=0;for(const[f,ph,a]of k){v+=Math.sin(x*TAU*f/BGW+ph)*a;s+=a}return v/s}};
function skyStrip(stops){return pbc(BGW,BGH,p=>{for(let y=0;y<BGH;y++){let i=0;while(i<stops.length-2&&y>=stops[i+1][0])i++;const a=stops[i],b=stops[i+1],t=clamp((y-a[0])/(b[0]-a[0]),0,1);const ca=hex(a[1]),cb=hex(b[1]);for(let x=0;x<BGW;x++)p.set(x,y,dith(x,y,t)?cb:ca)}})}
function ridgeLayer(p,rng,base,amp,col,hi,jag,snow){const n=tnoise(rng,5),c=hex(col),h=hi&&hex(hi);for(let x=0;x<BGW;x++){let v=n(x);if(jag)v=1-Math.abs(v)*2.2;const top=Math.round(base-amp*(.5+.5*v));for(let y=top;y<BGH;y++)p.set(x,y,snow&&y<top+snow*(.6+.4*Math.sin(x*.9))?hex('#ffffff'):(h&&y<top+2?h:c))}}
function blob(p,cx,cy,r,col,hi,sh,rng){for(let i=0;i<6;i++){const a=rng()*TAU,d=r*.5*rng();p.disc(Math.round(cx+Math.cos(a)*d),Math.round(cy+Math.sin(a)*d*.6),Math.round(r*(.5+rng()*.3)),hex(col))}
  if(hi)for(let i=0;i<3;i++)p.disc(Math.round(cx-r*.3+rng()*r*.6),Math.round(cy-r*.4+rng()*r*.3),Math.max(1,Math.round(r*.22)),hex(hi));if(sh)p.ell(Math.round(cx),Math.round(cy+r*.55),r*.7,r*.2,hex(sh))}
/* natural trees: tapered curved trunk with bark, flared roots, forked branches, layered leaf masses lit from the upper right */
function paintTree(p,rng,x,gy,h,P,o){o=o||{};const H=v=>typeof v==='number'?v:hex(v),bk=P.bark.map(H),lf=P.leaf.map(H),w=Math.max(2,h*(o.wf||.085)),th=h*(o.trunk||.56),lean=(rng()-.5)*h*.12,sx=x=>Math.round(x);
  const cxAt=t=>x+lean*t*t;
  for(let i=0;i<3;i++){const sd=i===0?-1:i===1?1:(rng()<.5?-1:1),rx=x+sd*w*(.2+rng()*.2),ex=x+sd*w*(1+rng()*1.2);p.line(rx,gy-3,ex,gy,bk[2],2);p.line(rx,gy-4,ex-sd,gy-1,bk[1],1)}
  for(let y=Math.round(gy);y>=gy-th;y--){const t=(gy-y)/th,ww=w*(1-t*.55)+(t<.12?(.12-t)*w*3:0),cx=cxAt(t),x0=sx(cx-ww/2),x1=sx(cx+ww/2);
    for(let xx=x0;xx<=x1;xx++){let c=bk[1];if(xx===x0)c=bk[2];else if(xx>=x1-(ww>4?1:0))c=bk[0];else if(((xx*7+(y>>2)*3+(y>>1))%6)===0)c=bk[2];p.set(xx,y,c)}}
  const cl=[],top=[cxAt(1),gy-th];cl.push([top[0],top[1]-h*.14,h*(o.crown||.3)]);
  const nb=o.br!=null?o.br:2+(rng()*2|0);for(let i=0;i<nb;i++){const t=.5+rng()*.42,sd=i%2?1:-1,bx=cxAt(t),by=gy-th*t,ex=bx+sd*h*(.16+rng()*.16),ey=by-h*(.1+rng()*.14);
    p.line(bx,by,ex,ey,bk[2],2);p.line(bx,by-1,ex,ey-1,bk[1],1);p.line((bx+ex)/2,(by+ey)/2,(bx+ex)/2+sd*h*.06,(by+ey)/2-h*.08,bk[2],1);cl.push([ex,ey-h*.05,h*(.15+rng()*.07)])}
  cl.sort((a,b)=>b[1]-a[1]);
  for(const[cx,cy,r]of cl){const D=[];for(let k=0;k<8;k++){const a=rng()*TAU,d=r*.55*rng();D.push([cx+Math.cos(a)*d,cy+Math.sin(a)*d*.7,r*(.45+rng()*.3)])}
    const x0=sx(cx-r*1.3),x1=sx(cx+r*1.3),y0=sx(cy-r*1.1),y1=sx(cy+r);

  if(e.vx){let nx=e.x+e.vx;const ex=e.vx>0?nx+hw:nx-hw,tx=Math.floor(ex/16),y0=Math.floor((e.y-e.h+1)/16),y1=Math.floor((e.y-1)/16);
    for(let ty=y0;ty<=y1;ty++)if(SOLID(tileAt(tx,ty))){nx=e.vx>0?tx*16-hw-.01:(tx+1)*16+hw+.01;e.vx=0;e.hitWall=1;break}e.x=nx}
  const py=e.y;let ny=e.y+e.vy;e.onGround=false;const x0=Math.floor((e.x-hw+.5)/16),x1=Math.floor((e.x+hw-.5)/16);

function updShots(){const S=G.shots;for(let i=S.length-1;i>=0;i--){const s=S[i];s.x+=s.vx;s.y+=s.vy;s.vy+=s.g||0;s.life--;s.t++;let dead=s.life<=0;

    if(s.from==='e'){const b0=s.h?[s.x-s.r,s.y-s.h,s.r*2,s.h]:null;for(const p of G.players){if(!p.alive||(s.hs&&s.hs.has(p)))continue;const b=p.box();if(b0?ovl(b0,b):circRect(s.x,s.y,s.r,b)){const r=p.hurt(s.dmg,Math.sign(s.vx||1)*(s.knock?3.5:2),s.knock?-3:-1.5,{x:s.x-s.vx*4},{proj:1,slow:s.slow,knock:s.knock,elem:s.kind==='fireball'||s.kind==='firewall'?'fire':0});if(r){if(s.pierce)(s.hs=s.hs||new Set()).add(p);else dead=true}}}}

  const NB=[-1,1,1,1,2,2,4,4,4,5,5,5,8,9,9,10,10,11,13,14,16,17,17,18,20,21];
  const gmul=(x,y)=>{let z=0;for(let i=7;i>=0;i--){z=(z<<1)^((z>>>7)*0x11D);z^=((y>>>i)&1)*x}return z&255};
  const rawMods=v=>{let r=(16*v+128)*v+64;if(v>=2){const n=Math.floor(v/7)+2;r-=(25*n-10)*n-55;if(v>=7)r-=36}return r};
  const dataCW=v=>Math.floor(rawMods(v)/8)-ECC[v]*NB[v];
  function rsDiv(d){const r=new Array(d).fill(0);r[d-1]=1;let root=1;for(let i=0;i<d;i++){for(let j=0;j<d;j++){r[j]=gmul(r[j],root);if(j+1<d)r[j]^=r[j+1]}root=gmul(root,2)}return r}
  function rsRem(data,div){const r=new Array(div.length).fill(0);for(const b of data){const f=b^r.shift();r.push(0);div.forEach((c,i)=>r[i]^=gmul(c,f))}return r}
  function alignPos(v){if(v===1)return[];const n=Math.floor(v/7)+2,size=v*4+17,step=v===32?26:Math.ceil((v*4+4)/(n*2-2))*2,r=[6];for(let p=size-7;r.length<n;p-=step)r.splice(1,0,p);return r}
  function encode(text){
    const bytes=Array.from(new TextEncoder().encode(text));let ver=0;
    for(let v=1;v<=25;v++){const cap=dataCW(v)*8,need=4+(v<=9?8:16)+bytes.length*8;if(need<=cap){ver=v;break}}
    if(!ver)throw new Error('Text too long for QR');
    const bits=[],push=(val,n)=>{for(let i=n-1;i>=0;i--)bits.push((val>>>i)&1)};
    push(4,4);push(bytes.length,ver<=9?8:16);for(const b of bytes)push(b,8);
    const cap=dataCW(ver)*8;push(0,Math.min(4,cap-bits.length));while(bits.length%8)bits.push(0);
    const data=[];for(let i=0;i<bits.length;i+=8){let b=0;for(let j=0;j<8;j++)b=(b<<1)|bits[i+j];data.push(b)}
    for(let p=0xEC;data.length<dataCW(ver);p^=0xEC^0x11)data.push(p);
    const nb=NB[ver],el=ECC[ver],raw=Math.floor(rawMods(ver)/8),nShort=nb-raw%nb,shortLen=Math.floor(raw/nb),div=rsDiv(el),blocks=[];
    for(let i=0,k=0;i<nb;i++){const dat=data.slice(k,k+shortLen-el+(i<nShort?0:1));k+=dat.length;const ec=rsRem(dat,div);if(i<nShort)dat.push(0);blocks.push(dat.concat(ec))}
    const all=[];for(let i=0;i<blocks[0].length;i++)blocks.forEach((b,j)=>{if(i!==shortLen-el||j>=nShort)all.push(b[i])});
    const size=ver*4+17,M=[],F=[];for(let y=0;y<size;y++){M.push(new Array(size).fill(false));F.push(new Array(size).fill(false))}
    const fn=(x,y,d)=>{M[y][x]=d;F[y][x]=true};
    for(let i=0;i<size;i++){fn(6,i,i%2===0);fn(i,6,i%2===0)}
    const finder=(cx,cy)=>{for(let dy=-4;dy<=4;dy++)for(let dx=-4;dx<=4;dx++){const d=Math.max(Math.abs(dx),Math.abs(dy)),x=cx+dx,y=cy+dy;if(x>=0&&x<size&&y>=0&&y<size)fn(x,y,d!==2&&d!==4)}};
    finder(3,3);finder(size-4,3);finder(3,size-4);
    const al=alignPos(ver),na=al.length;for(let i=0;i<na;i++)for(let j=0;j<na;j++){if((i===0&&j===0)||(i===0&&j===na-1)||(i===na-1&&j===0))continue;for(let dy=-2;dy<=2;dy++)for(let dx=-2;dx<=2;dx++)fn(al[i]+dx,al[j]+dy,Math.max(Math.abs(dx),Math.abs(dy))!==1)}
    const drawFormat=mask=>{const d=(0<<3)|mask;let r=d;for(let i=0;i<10;i++)r=(r<<1)^((r>>>9)*0x537);const b=((d<<10)|r)^0x5412,g=i=>((b>>>i)&1)!==0;
      for(let i=0;i<=5;i++)fn(8,i,g(i));fn(8,7,g(6));fn(8,8,g(7));fn(7,8,g(8));for(let i=9;i<15;i++)fn(14-i,8,g(i));
      for(let i=0;i<8;i++)fn(size-1-i,8,g(i));for(let i=8;i<15;i++)fn(8,size-15+i,g(i));fn(8,size-8,true)};
    drawFormat(0);
    if(ver>=7){let r=ver;for(let i=0;i<12;i++)r=(r<<1)^((r>>>11)*0x1F25);const b=(ver<<12)|r;for(let i=0;i<18;i++){const bit=((b>>>i)&1)!==0,a=size-11+i%3,c=Math.floor(i/3);fn(a,c,bit);fn(c,a,bit)}}
    let i=0;for(let right=size-1;right>=1;right-=2){if(right===6)right=5;for(let v=0;v<size;v++)for(let j=0;j<2;j++){const x=right-j,up=((right+1)&2)===0,y=up?size-1-v:v;if(!F[y][x]&&i<all.length*8){M[y][x]=((all[i>>>3]>>>(7-(i&7)))&1)!==0;i++}}}
    const maskF=[(x,y)=>(x+y)%2===0,(x,y)=>y%2===0,(x,y)=>x%3===0,(x,y)=>(x+y)%3===0,(x,y)=>(Math.floor(x/3)+Math.floor(y/2))%2===0,(x,y)=>x*y%2+x*y%3===0,(x,y)=>(x*y%2+x*y%3)%2===0,(x,y)=>((x+y)%2+x*y%3)%2===0];
    const apply=m=>{for(let y=0;y<size;y++)for(let x=0;x<size;x++)if(!F[y][x]&&maskF[m](x,y))M[y][x]=!M[y][x]};
    const penalty=()=>{let p=0;for(let y=0;y<size;y++){let run=1;for(let x=1;x<=size;x++){if(x<size&&M[y][x]===M[y][x-1])run++;else{if(run>=5)p+=run-2;run=1}}}
      for(let x=0;x<size;x++){let run=1;for(let y=1;y<=size;y++){if(y<size&&M[y][x]===M[y-1][x])run++;else{if(run>=5)p+=run-2;run=1}}}
      for(let y=0;y<size-1;y++)for(let x=0;x<size-1;x++){const c=M[y][x];if(c===M[y][x+1]&&c===M[y+1][x]&&c===M[y+1][x+1])p+=3}
      let dark=0;for(const r of M)for(const c of r)if(c)dark++;p+=Math.floor(Math.abs(dark*20-size*size*10)/(size*size))*10;return p};
    let best=0,bp=1e9;for(let m=0;m<8;m++){apply(m);drawFormat(m);const p=penalty();if(p<bp){bp=p;best=m}apply(m)}
    apply(best);drawFormat(best);return{size,M,ver}}
  function canvas(text,px){const q=encode(text),s=px||Math.max(3,Math.floor(300/(q.size+8))),c=document.createElement('canvas');c.width=c.height=(q.size+8)*s;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.fillStyle='#000';
    for(let y=0;y<q.size;y++)for(let X=0;X<q.size;X++)if(q.M[y][X])x.fillRect((X+4)*s,(y+4)*s,s,s);return c}
  return{encode,canvas};
})();

/* ===== NETWORK CO-OP: host-authoritative, two transports =====
   LOCAL HOTSPOT : WebRTC DataChannel, offer/answer exchanged as QR codes (no internet, no server)
   ONLINE / LAN  : WebSocket relay server (server/server.js) with room codes and reconnect tokens
   The host simulates everything (both heroes, enemies, damage, loot). The guest sends its pad
   every tick and renders interpolated snapshots + replayed effect events. */
const NET_PROTO=3;
const ONLINE_SERVER_URL='';  /* e.g. 'wss://samsya-server.onrender.com/ws'  (leave '' to use the server that served this page) */
const r2=v=>Math.round(v*100)/100;

/* ---- compact SDP: keeps only what a DataChannel needs, so it fits in a scannable QR ---- */
function sdpPack(sdp,kind){const g=k=>{const m=sdp.match(new RegExp('a='+k+':([^\\r\\n]*)'));return m?m[1].trim():''};
  const fp=(g('fingerprint').split(' ')[1]||'');const bin=fp.split(':').map(h=>String.fromCharCode(parseInt(h,16))).join('');
  const su={actpass:'x',active:'a',passive:'p'}[g('setup')]||'x';const C=[];
  for(const m of sdp.matchAll(/a=candidate:\S+ 1 udp \d+ (\S+) (\d+) typ (host|srflx)/gi)){const c=m[1]+','+(+m[2]).toString(36)+(m[3]==='srflx'?',s':'');if(!C.includes(c))C.push(c)}
  return['SS1',kind,su,g('ice-ufrag'),g('ice-pwd'),btoa(bin).replace(/=+$/,''),C.join(';')].join('|')}
function sdpUnpack(s,want){s=String(s||'').trim().replace(/\s+/g,'');const p=s.split('|');if(p[0]!=='SS1'||p.length<7)throw new Error('That is not a SAM & SYA connection code');
  const[,kind,su,uf,pw,fb,cs]=p;if(want&&kind!==want)throw new Error(want==='O'?'This is an answer code. Scan the HOST invite instead.':'This is an invite code. Scan the code shown on your partner\u2019s phone after they joined.');
  const bin=atob(fb+'='.repeat((4-fb.length%4)%4)),fp=[...bin].map(c=>c.charCodeAt(0).toString(16).padStart(2,'0').toUpperCase()).join(':');
  const L=['v=0','o=- 4611731400430051336 2 IN IP4 127.0.0.1','s=-','t=0 0','a=group:BUNDLE 0','a=msid-semantic: WMS','m=application 9 UDP/DTLS/SCTP webrtc-datachannel','c=IN IP4 0.0.0.0',
    'a=ice-ufrag:'+uf,'a=ice-pwd:'+pw,'a=ice-options:trickle','a=fingerprint:sha-256 '+fp,'a=setup:'+({x:'actpass',a:'active',p:'passive'}[su]||'actpass'),'a=mid:0','a=sctp-port:5000','a=max-message-size:262144'];
  (cs?cs.split(';'):[]).forEach((c,i)=>{const[ip,pt,t]=c.split(',');L.push(`a=candidate:${i+1} 1 udp ${2122260223-i*256} ${ip} ${parseInt(pt,36)} typ ${t==='s'?'srflx':'host'} generation 0`)});
  L.push('a=end-of-candidates');return L.join('\r\n')+'\r\n'}

/* ---- transport: WebRTC (local) ---- */
class RTCT{
  constructor(h){this.h=h;this.kind='rtc';this.pc=new RTCPeerConnection({iceServers:[]});this.pc.onconnectionstatechange=()=>{const s=this.pc.connectionState;if(s==='failed'||s==='closed')this.lost('rtc '+s)}}
  bind(dc){this.dc=dc;dc.onopen=()=>this.h.peer(true);dc.onclose=()=>this.lost('channel closed');dc.onmessage=e=>this.h.msg(e.data)}
  lost(r){if(this.dead)return;this.dead=true;this.h.peer(false,r)}
  gather(){return new Promise(res=>{const pc=this.pc;if(pc.iceGatheringState==='complete')return res();const t=setTimeout(res,3500);pc.addEventListener('icegatheringstatechange',()=>{if(pc.iceGatheringState==='complete'){clearTimeout(t);res()}})})}
  async offer(){this.bind(this.pc.createDataChannel('g',{ordered:true}));await this.pc.setLocalDescription(await this.pc.createOffer());await this.gather();return sdpPack(this.pc.localDescription.sdp,'O')}
  async answer(code){const sdp=sdpUnpack(code,'O');this.pc.ondatachannel=e=>this.bind(e.channel);await this.pc.setRemoteDescription({type:'offer',sdp});await this.pc.setLocalDescription(await this.pc.createAnswer());await this.gather();return sdpPack(this.pc.localDescription.sdp,'A')}
  async accept(code){await this.pc.setRemoteDescription({type:'answer',sdp:sdpUnpack(code,'A')})}
  send(s){if(this.dc&&this.dc.readyState==='open'){if(this.dc.bufferedAmount>1e6)return;this.dc.send(s)}}
  close(){this.dead=true;try{this.dc&&this.dc.close()}catch(e){}try{this.pc.close()}catch(e){}}
}
/* ---- transport: WebSocket relay (online, or LAN server running in Termux) ---- */
class WST{
  constructor(h,url){this.h=h;this.kind='ws';this.url=url;this.code=null;this.token=null;this.want=null;this.tries=0;this.closed=false}
  open(first){this.want=first;this.connect()}
  connect(){let ws;try{ws=this.ws=new WebSocket(this.url)}catch(e){this.h.err('Bad server address');return}
    ws.onopen=()=>{this.tries=0;ws.send(JSON.stringify(this.token?{t:'rejoin',code:this.code,token:this.token,v:NET_PROTO}:this.want))};
    ws.onmessage=e=>{const d=e.data;if(d[0]==='>'){this.h.msg(d.slice(1));return}let m;try{m=JSON.parse(d)}catch(x){return}
      if(m.t==='created'||m.t==='joined'||m.t==='rejoined'){this.code=m.code;this.token=m.token;this.slot=m.slot;this.h.room(m)}
      else if(m.t==='peer')this.h.peer(!!m.on,m.on?'':'partner offline');
      else if(m.t==='err'){this.h.err(m.m);if(m.fatal){this.closed=true;ws.close()}}};
    ws.onclose=()=>{if(this.closed)return;this.h.link(false);if(this.token&&this.tries<30){this.tries++;setTimeout(()=>{if(!this.closed)this.connect()},2000)}else if(!this.token)this.h.err('Cannot reach the multiplayer server')};
    ws.onerror=()=>{}}
  send(s){if(this.ws&&this.ws.readyState===1)this.ws.send('>'+s)}
  close(){this.closed=true;try{this.ws&&this.ws.send(JSON.stringify({t:'leave'}))}catch(e){}try{this.ws&&this.ws.close()}catch(e){}}
}

/* ---- transport: Firebase Realtime Database relay (online rooms on GitHub Pages, no own server) ----
   rooms/{CODE}: host uid, guest uid, p0/p1 presence, m/0 and m/1 message inboxes (batched, deleted after reading) */
class FBT{
  constructor(h,role,code){this.h=h;this.kind='fb';this.role=role;this.slot=role==='host'?0:1;this.code=String(code||'').toUpperCase().trim();this.out=[];this.ft=0;this.un=[];this.closed=false;this.other=false;this.conn=null;this.D=null}
  static mk(){const A='ABCDEFGHJKLMNPQRSTUVWXYZ23456789',r=crypto.getRandomValues(new Uint8Array(5));let c='';for(const b of r)c+=A[b%A.length];return c}
  p(x){return'rooms/'+this.code+(x?'/'+x:'')}
  denied(e){return/permission/i.test(((e&&e.code)||'')+' '+((e&&e.message)||''))}
  fatal(m){this.h.err(m);this.close(true)}
  async open(){const D=await CLOUD.rtdb();if(this.closed)return;if(!D){this.fatal(t('mp.nodb'));return}
    this.D=D;const F=D.fn,db=D.db,uid=CLOUD.user&&CLOUD.user.uid;if(!uid){this.fatal(t('mp.needlogin'));return}
    try{
      if(this.role==='host'){let ok=false;
        for(let i=0;i<6&&!ok;i++){this.code=FBT.mk();const ex=await F.get(F.ref(db,this.p()));if(ex.exists())continue;
          await F.set(F.ref(db,this.p()),{host:uid,v:NET_PROTO,t:F.serverTimestamp()});ok=true}
        if(!ok)throw new Error('no free room code');if(this.closed)return;
        this.listen();this.h.room({t:'created',code:this.code})}
      else{const sn=await F.get(F.ref(db,this.p()));if(this.closed)return;
        if(!sn.exists()){this.fatal(t('mp.noroom'));return}
        const r=sn.val()||{};if(r.v!==NET_PROTO){this.fatal('Both players need the same game version');return}
        if(r.guest&&r.guest!==uid&&r.p1){this.fatal(t('mp.full'));return}
        await F.set(F.ref(db,this.p('guest')),uid);await F.remove(F.ref(db,this.p('m/1')));if(this.closed)return;
        this.listen();this.h.room({t:'joined',code:this.code})}
    }catch(e){console.error('[RTDB]',e);if(!this.closed)this.fatal(this.denied(e)?t('mp.rules'):t('mp.fail',{c:(e&&(e.code||e.message))||'?'}))}}
  listen(){const F=this.D.fn,db=this.D.db,me=F.ref(db,this.p('p'+this.slot)),ot=1-this.slot;
    this.un.push(F.onValue(F.ref(db,'.info/connected'),sn=>{if(this.closed)return;const on=sn.val()===true;
      if(on){F.onDisconnect(me).remove().catch(()=>{});F.set(me,true).catch(e=>console.warn('[RTDB] presence',e))}
      if(this.conn!==null&&on!==this.conn){this.h.link(on);if(on&&this.other)this.h.peer(true)}this.conn=on}));
    this.un.push(F.onValue(F.ref(db,this.p('p'+ot)),sn=>{if(this.closed)return;const on=sn.val()===true;if(on===this.other)return;this.other=on;
      if(on)this.h.peer(true);else this.h.peer(false,'Partner left')}));
    this.un.push(F.onChildAdded(F.ref(db,this.p('m/'+this.slot)),sn=>{const v=sn.val();F.remove(sn.ref).catch(()=>{});if(this.closed||!v||typeof v.d!=='string')return;
      for(const x of v.d.split('\n'))if(x)this.h.msg(x)}));
    if(this.role==='guest')this.un.push(F.onValue(F.ref(db,this.p('host')),sn=>{if(!sn.exists()&&!this.closed){this.other=false;this.h.peer(false,'Partner left');this.fatal(t('mp.closed'))}}))}
  send(x){if(this.closed||!this.other||!this.D)return;this.out.push(x);if(!this.ft)this.ft=setTimeout(()=>this.flush(),50)}
  flush(){clearTimeout(this.ft);this.ft=0;if(!this.out.length||!this.D)return;const d=this.out.join('\n');this.out=[];
    const F=this.D.fn;F.push(F.ref(this.D.db,this.p('m/'+(1-this.slot))),{d}).catch(e=>console.warn('[RTDB] send',e))}
  close(gone){if(this.closed)return;if(!gone)this.flush();this.closed=true;clearTimeout(this.ft);for(const u of this.un){try{u()}catch(e){}}this.un=[];
    if(!this.D||gone)return;const F=this.D.fn,db=this.D.db,q=r=>F.remove(F.ref(db,this.p(r))).catch(()=>{});
    try{F.onDisconnect(F.ref(db,this.p('p'+this.slot))).cancel().catch(()=>{})}catch(e){}
    if(this.role==='host')setTimeout(()=>q(''),400);else{q('p1');q('m/1');q('guest')}}
}

const NET={on:false,role:null,mode:null,tr:null,peer:false,link:true,hero:'sam',rdy:[false,false],code:'',status:'',rtt:0,name:'',pname:'',inGame:false,lost:false,
  evq:[],depth:0,emit:false,orig:{},es:new Map(),known:new Set(),broken:new Set(),nid:0,rate:2,delay:5,
  q:[],cur:null,rt:null,et:new Map(),eo:new Map(),pc:[0,0,0,0,0,0,0],rpc:[0,0,0,0,0,0,0],lastIn:'',inT:0,lastRx:0,worldSig:'',
  get gi(){return this.hero==='sam'?1:0},              /* guest's player index */
  get hi(){return this.hero==='sam'?0:1},              /* host's player index */
  get me(){return this.role==='guest'?this.gi:this.hi},
  fbOK(){return CLOUD.configured()&&!!FIREBASE_CONFIG.databaseURL&&/^https?:$/.test(location.protocol)},
  serverLabel(){const u=this.serverURL();return u==='firebase'?t('srv.fb'):u},
  serverURL(){const s=(SAVE.set.srv||ONLINE_SERVER_URL||'').trim();if(s)return s;if(this.fbOK())return'firebase';if(/^https?:$/.test(location.protocol))return(location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws';return''},
  handlers(){return{msg:d=>this.rx(d),peer:(on,r)=>this.onPeer(on,r),room:m=>this.onRoom(m),err:m=>{this.status=m;UI.toast('Multiplayer',m);UI.netRefresh()},link:on=>{this.link=on;if(!on)this.onPeer(false,'Reconnecting to the server\u2026');this.status=on?'':'Reconnecting to the server\u2026';UI.netRefresh()}}},
  begin(role,mode){this.end(true);this.on=true;this.role=role;this.mode=mode;this.peer=false;this.lost=false;this.rdy=[false,false];this.hero=SAVE.char||'sam';this.rate=mode==='local'?2:3;this.delay=mode==='local'?6:10;this.status='';this.name=CLOUD.name()||'Player';this.pname='';this.inGame=false},
  end(silent){if(this.tr){try{this.send({t:'bye'})}catch(e){}this.tr.close()}this.tr=null;this.on=false;this.role=null;this.peer=false;this.inGame=false;this.q=[];this.cur=null;this.et.clear();this.eo.clear();this.es.clear();this.known.clear();
    if(this.pingT){clearInterval(this.pingT);this.pingT=0}if(!silent&&G.lvl){G.state='title';G.lvl=null;AU.music('title')}},
  send(o){if(this.tr)this.tr.send(JSON.stringify(o))},
  /* --- local hotspot (WebRTC) --- */
  async camWarm(){try{const s=await navigator.mediaDevices.getUserMedia({video:true});s.getTracks().forEach(t=>t.stop());return true}catch(e){return false}},
  async hostLocal(){this.begin('host','local');this.tr=new RTCT(this.handlers());UI.netRefresh();await this.camWarm();this.offerCode=await this.tr.offer();return this.offerCode},
  async hostAccept(code){await this.tr.accept(code);this.status='Connecting\u2026';UI.netRefresh()},
  async joinLocal(code){this.begin('guest','local');this.tr=new RTCT(this.handlers());this.answerCode=await this.tr.answer(code);return this.answerCode},
  /* --- online / LAN server --- */
  online(role,code){const url=this.serverURL();
    if(url==='firebase'){if(!CLOUD.user){UI.toast('Multiplayer',t('mp.needlogin'));UI.go('account');return false}
      this.begin(role,'online');this.rate=4;this.delay=12;this.tr=new FBT(this.handlers(),role,code);this.status='Connecting to server\u2026';this.tr.open();return true}
    if(!url){UI.toast('Multiplayer','Set the server address first (Multiplayer \u2192 Server)');return false}
    this.begin(role,'online');this.tr=new WST(this.handlers(),url);this.status='Connecting to server\u2026';this.tr.open(role==='host'?{t:'create',v:NET_PROTO}:{t:'join',code:String(code||'').toUpperCase().trim(),v:NET_PROTO});return true},
  onRoom(m){this.code=m.code;this.link=true;this.status=m.t==='created'?'Waiting for your partner\u2026':'';if(m.t==='created')UI.show('room');UI.netRefresh()},
  onPeer(on,why){const was=this.peer;this.peer=on;this.lastRx=performance.now();
    if(on){this.lost=false;this.status='';this.send({t:'hi',v:NET_PROTO,name:this.name,role:this.role});

  j4:  { ch: 4, t: 'Janji di celah es', x: 'Glacius menunggu "Bintang". Ia tahu namaku dan tahu desaku. Bagaimana mungkin?' },
  j5:  { ch: 5, t: 'Kalimat yang tidak selesai', x: 'Malgrim mati sebelum menyelesaikan kalimatnya. "Malam itu... siapa yang..." Siapa yang apa?' },
  j6:  { ch: 6, t: 'Naga terakhir', x: 'Namanya Aurelia. Ia tidak membalas seranganku. Ia tahu namaku.' },
  j7:  { ch: 7, t: 'Celah Merah', x: 'Di bawah kuil ada ruang yang tidak ada di peta mana pun. Rantai sebesar pohon. Bekas cakar di dinding. Dan bau yang kukenal dari malam itu: api yang tidak berasap.' },
  j8:  { ch: 7, t: 'Dravok', x: 'Naga merah itu menyebut namaku sebelum aku menyebut namanya. Ia bilang ia melihatku di tepi sungai. Ia bilang ia mencoba berhenti.' },
  j7:  { ch: 6, t: 'The Last Tear', x: 'Aku membunuh satu-satunya yang selama ini melindungiku. Kalau aku melihat langit malam, aku melihatnya. Setiap kali.' },
  jm:  { ch: 7, t: 'Kenangan Aurelia', x: 'Sebelas tahun. Ia mengunjungi makam ibuku setiap musim semi. Ia meninggalkan bunga bintang dan pergi sebelum fajar. Ia menonton aku belajar mengayunkan pedang. Ia tidak pernah sekali pun mendekat.' }

/* ---------------- lore ---------------- */
lore: {
  pact:   { t: 'Perjanjian Fajar', x: 'Dua ratus tahun lalu manusia dan naga membagi lembah utara. Naga menjaga gunung dan hujan, manusia menjaga ladang. Ksatria Penjaga Perjanjian bersumpah melindungi keduanya.' },
  crimson: { t: 'Api yang tidak berasap', x: 'Api naga merah tidak menghasilkan asap karena membakar udara itu sendiri. Hanya satu naga merah yang tersisa setelah Perjanjian Fajar. Ordo menamainya Dravok dan menulis bahwa ia mati. Mereka berbohong.' },
  chain:  { t: 'Rantai Sigil', x: 'Rantai sigil tidak mengikat tubuh, melainkan kehendak. Yang memegang ujungnya bisa memerintah apa pun yang terikat di ujung lain. Sigil hanya bisa dipatahkan dari dalam, oleh yang mau menanggung apinya.' },
  order:  { t: 'Ordo Fajar Merah', x: 'Ordo lahir dari kelompok bangsawan yang menginginkan tanah perjanjian. Mereka tidak bisa merebutnya selama naga masih ada. Jadi mereka membuat perang.' },
  sigil:  { t: 'Sigil Abu', x: 'Sihir terlarang yang mengikat makhluk hidup lewat rasa sakit. Api dari sigil tidak berasap dan berbau besi. Para saksi selalu mengira itu napas naga.' },
  hening: { t: 'Malam Lereng Hening', x: 'Catatan Ordo menyebut desa Lereng Hening dihancurkan naga perak. Catatan yang sama tidak menjelaskan kenapa pasukan Ordo sudah berada di bukit sebelum api menyala.' },
  silver: { t: 'Naga Perak', x: 'Naga perak bernyanyi ketika malam cerah. Para petani lama menyebut nyanyian itu "suara bintang". Mereka meninggalkan susu di ambang pintu sebagai ucapan terima kasih.' },
  pip:    { t: 'Pip', x: 'Naga perak kecil yang dirawat Luna. Ia lahir dari telur yang dititipkan seseorang di gua, dibungkus kain biru dan selembar bunga bintang kering.' },
  frag0:  { t: 'Fragmen Kuil I', x: '"Aku melihat seorang anak di tepi sungai. Ia tidak menangis keras. Ia menangis seperti orang dewasa, diam-diam." (tulisan tangan, tinta biru)' },
  frag1:  { t: 'Fragmen Kuil II', x: '"Sayap kiriku belum sembuh. Panah Ordo dilapisi abu. Tidak apa. Aku masih bisa berjalan dalam wujud manusia." (tinta biru)' },
  frag2:  { t: 'Fragmen Kuil III', x: '"Ia mulai berlatih pedang hari ini. Ayunannya terlalu lebar. Ibunya pasti tertawa melihatnya." (tinta biru)' },
  frag3:  { t: 'Fragmen Kuil IV', x: '"Glacius berjanji menjaga celah. Malgrim berjanji menjaga reruntuhan. Aku tidak berhak meminta itu dari mereka." (tinta biru)' },
  frag4:  { t: 'Fragmen Kuil V', x: '"Ia menulis daftar naga yang ingin ia bunuh. Namaku tidak ada di sana. Ia tidak tahu namaku." (tinta biru)' },
  frag5:  { t: 'Fragmen Kuil VI', x: '"Kalau ia datang, aku tidak akan lari. Ia sudah lari dari kesedihannya selama sebelas tahun. Biar aku saja yang berhenti." (tinta biru)' },
  aurelia_past: { t: 'Masa lalu Aurelia', x: 'Aurelia menetas tiga ratus tahun lalu di puncak Kuil Bintang. Ia satu-satunya naga yang memilih tinggal di dekat desa manusia. Pada malam Lereng Hening ia terbang menuju api, bukan dari api. Ia menahan atap rumah keluarga SAM dengan punggungnya sampai panah abu menembus sayapnya. Ia menyelamatkan satu anak. Ia tidak bisa menyelamatkan ibunya. Setelah itu ia memilih menjadi musuh dalam cerita SAM, karena kebencian terasa lebih ringan daripada rasa bersalah. Ia salah soal itu. Ia tahu ia salah. Tapi ia tetap memilihnya.' }
},

/* ---------------- kenangan boss ---------------- */
bosses: {
  grukk:   { t: 'Grukk', x: 'Ia memimpin klan goblin terakhir di Greenwood setelah hutan mereka dibakar dua kali. Ia tidak pernah melihat naga menyerang. Ia hanya melihat jubah merah.' },
  arachne: { t: 'Arachne', x: 'Induk sarang di tambang tua. Tiga puluh tahun lalu langit-langit tambang runtuh, dan seekor naga perak menahannya sampai penambang terakhir keluar. Arachne mengingat bau sayap itu.' },
  ignis:   { t: 'Ignis', x: 'Roh api yang dulu menghangatkan tungku-tungku Emberfall. Ordo merantainya dengan Sigil Abu dan memaksanya membakar desa yang ia lindungi. Ketika rantainya patah, ia tersenyum.' },
  glacius: { t: 'Glacius', x: 'Penjaga celah utara. Ia membekukan dirinya untuk menahan longsoran di atas sebuah desa, lalu berjanji pada "Bintang" untuk menjaga jalan bagi seorang anak dari Lereng Hening.' },
  malgrim: { t: 'Malgrim', x: 'Ksatria Penjaga Perjanjian terakhir. Ordo membunuh Lady Seren, istrinya, karena menolak menandatangani perang. Ia menjaga reruntuhan selama dua puluh tahun agar tidak ada pemburu yang sampai ke kuil.' },
  dravok:  { t: 'Aurelia', x: 'Ia menghindari setiap serangan pertama. Ia hanya membalas ketika tidak ada pilihan lain. Di akhir, ia memilih wujud manusia supaya bisa melihat wajah SAM dari dekat.' }
},

      <h3>&nbsp;</h3><p style="color:#bfe8ff">${tt('ded')}</p><h3>&nbsp;</h3><p>AURELIA</p></div></div>
      <div class="row end"><button class="pri" data-a="scdone">${tt('cont')}</button></div></div>`;
  }
});
UI.P.scredits = function () { AU.music('sorrow'); };
UI.P.camp = function () { AU.music('camp'); };
{ const m0 = UI.S.map; UI.S.map = function () { const h = m0.apply(this, arguments); return h.replace('<div class="row">', `<div class="row"><button data-a="camp">${img('flame', 'bi')}${tt('camp')}</button><button data-a="book">${img('scroll', 'bi')}${tt('book')}</button>`); }; }
{ const se = UI.S.settings; UI.S.settings = function () { const h = se.apply(this, arguments), s = setv('tSpd', 1), ov = v => t(v ? 'on' : 'off');
  const sec = `<h3>${tt('sec')}</h3><div class="row"><span class="lb">${tt('spd')}</span>${[0, 1, 2, 3].map(i => `<button class="seg ${s === i ? 'on' : ''}" data-a="tspd:${i}">${tt('s' + i)}</button>`).join('')}</div>
    <div class="row"><button class="seg ${setv('vnAuto', 0) ? 'on' : ''}" data-a="vnauto">${tt('auto', { v: ov(setv('vnAuto', 0)) })}</button><button class="seg ${setv('vnReplay', 0) ? 'on' : ''}" data-a="vnreplay">${tt('replay', { v: ov(setv('vnReplay', 0)) })}</button></div>`;
  const key = `<h3>${t('touch')}</h3>`; return h.includes(key) ? h.replace(key, sec + key) : h; }; }
Object.assign(UIX, {
  camp() { this.go('camp'); },
  book(x) { this.bookTab = x || this.bookTab || 'jour'; if (this.cur === 'book') this.rerender(); else this.go('book'); },
  talk(id) { const tk = npcNext(id); if (!tk) return; const s = S(); VN.play(tk.scene).then(() => { s.talk[id] = (s.talk[id] || 0) + 1; saveGame(); STORY.flushNotes(); this.show('camp'); }); },
  replay(id) { VN.play(id).then(() => this.show('book')); },
  tspd(x) { SAVE.set.tSpd = +x; saveGame(); this.rerender(); },
  vnauto() { SAVE.set.vnAuto = setv('vnAuto', 0) ? 0 : 1; saveGame(); this.rerender(); },
  vnreplay() { SAVE.set.vnReplay = setv('vnReplay', 0) ? 0 : 1; saveGame(); this.rerender(); }
});

window.DBG && Object.assign(window.DBG, { STORY, VN, BARK, STORY_S: S, frameOf });
